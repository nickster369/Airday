function weekView(){
  const shows = state.shows;
  const counts = DAYS.map((_, i) => shows.filter(s => s.day === i).length);
  const td = new Date().getDay();
  const dayShows = shows.filter(s => s.day === ui.day).sort((a,b) => sortTime(a).localeCompare(sortTime(b)));
  const unset = shows.filter(s => s.day == null || s.day === '');
  const infos = {}; shows.forEach(s => infos[s.id] = showInfo(s));
  const newDays = [0,0,0,0,0,0,0]; let newTotal = 0;
  shows.forEach(s => { const n = newEps(s, infos[s.id]); newTotal += n; if (n && s.day != null && s.day !== '') newDays[s.day] += n; });
  const ended = shows.filter(s => !s.backlog && infos[s.id].ended);
  let h = '<div class="top"><div><div class="sub">' + esc(seasonLabel(CUR)) + '</div><h1>This week</h1></div>' +
    '<div style="display:flex;gap:8px"><button class="iconbtn" data-act="settings" aria-label="Settings">' + ICON_GEAR + '</button>' +
    '<button class="iconbtn" data-act="add-show" aria-label="Find a show to add">' + ICON_PLUS + '</button></div></div>';
  h += '<div class="days" role="tablist" aria-label="Day of the week">' + DAYS.map((d,i) =>
    '<button role="tab" aria-selected="' + (i===ui.day) + '" class="day' + (i===ui.day?' on':'') + (i===td?' today':'') + (newDays[i]?' hasnew':'') + '" data-day="' + i + '" aria-label="' + DAYS_FULL[i] + ', ' + counts[i] + ' shows' + (newDays[i] ? ', ' + newDays[i] + ' new episodes' : '') + (i===td?', today':'') + '"><span class="l">' + d + '</span><span class="n">' + counts[i] + '</span></button>'
  ).join('') + '</div>';
  if (newTotal) h += '<div class="banner hot"><div><b>' + newTotal + ' new episode' + (newTotal === 1 ? '' : 's') + '</b> since you last checked. Days with new episodes have a dot.</div></div>';
  if (ended.length && settings.wrapSeen !== endedKey()) h += '<div class="banner"><div><b>' + ended.length + ' show' + (ended.length === 1 ? ' has' : 's have') + ' finished airing.</b> Wrap ' + (ended.length === 1 ? 'it' : 'them') + ' up to keep your week tidy.</div><div class="actions"><button class="btn" data-act="wrapup">Wrap up</button><button class="btn ghost" data-act="wrap-later">Not now</button></div></div>';
  if (settings.seasonSeen && settings.seasonSeen !== CUR.season + CUR.year) h += '<div class="banner"><div><b>' + esc(seasonLabel(CUR)) + ' has started.</b> See what’s new this season.</div><div class="actions"><button class="btn" data-act="season-new">Browse ' + esc(seasonLabel(CUR)) + '</button><button class="btn ghost" data-act="season-ok">Not now</button></div></div>';
  if (ui.busy.shows) h += '<p class="sync">Updating episode info…</p>';
  else if (ui.msg.shows) h += '<p class="sync">' + esc(ui.msg.shows) + '</p>';
  h += '<div class="sechead"><h2>' + DAYS_FULL[ui.day] + (ui.day===td ? ' (today)' : '') + '</h2><span class="sub">' + dayShows.length + ' show' + (dayShows.length===1?'':'s') + '</span></div>';
  if (!shows.length && !state.library.length){
    h += '<div class="empty"><div>Your week is empty. Pick this season’s shows, or bring in a backup from your old copy of the app.</div><div class="actions" style="width:100%"><button class="btn" data-goto="season">Browse ' + esc(seasonLabel(CUR)) + '</button><button class="btn ghost" data-act="settings">Restore a backup</button></div></div>';
  } else if (!shows.length){
    h += '<div class="empty"><div>Your week is empty. Pick this season’s shows and they’ll land on the right day.</div><button class="btn" data-goto="season">Browse ' + esc(seasonLabel(CUR)) + '</button></div>';
  } else if (!dayShows.length){
    h += '<div class="empty">Nothing on ' + DAYS_FULL[ui.day] + '.</div>';
  } else {
    h += '<div class="list">' + dayShows.map(showCard).join('') + '</div>';
  }
  if (unset.length){
    h += '<div class="sechead" style="margin-top:22px"><h2>Day not set</h2><span class="sub">Tap a show to pick its day</span></div><div class="list">' + unset.map(showCard).join('') + '</div>';
  }
  if (state.watchlist.length){
    const wl = state.watchlist.slice().sort((a,b) => (a.date||'9').localeCompare(b.date||'9'));
    h += '<div class="sechead" style="margin-top:22px"><h2>Movies on your list</h2><span class="sub">' + wl.length + '</span></div><div class="list">' + wl.map(m =>
      '<div class="card">' + tile(m.title, m.cover) +
      '<div class="cardmain"><span class="ttl"><span>' + esc(m.title) + '</span></span><span class="meta">' + esc(whenText(m.date)) + '</span>' + (m.where ? '<span class="meta">' + esc(m.where) + '</span>' : '') + '<a class="meta wlink" href="' + esc(watchLink(m, 'movie')) + '" target="_blank" rel="noopener">Where to watch</a></div>' +
      '<div class="side"><button class="sbtn done" data-wdone="' + m.id + '" aria-label="Mark ' + esc(m.title) + ' as seen">Seen</button>' +
      '<button class="sbtn" data-wdel="' + m.id + '" aria-label="Remove ' + esc(m.title) + ' from your list"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>'
    ).join('') + '</div>';
  }
  return h;
}

function showCard(s){
  const i = showInfo(s), fresh = newEps(s, i), ty = typeOf(s);
  const epLine = (i.finished ? 'All ' + i.total + ' watched' : 'Next: ep ' + (i.ep + 1) + ' of ' + (i.total || '?')) + (s.time ? ', ' + fmtTime(s.time) : '');
  const status = [i.airText, i.endText, (i.left != null && !i.finished) ? i.left + ' left' : ''].filter(Boolean).map((p, n) => n ? p[0].toLowerCase() + p.slice(1) : p).join(', ');
  const behind = i.behind > 0 ? ' <b>' + i.behind + ' to catch up</b>' : '';
  return '<div class="card">' + tile(s.title, s.cover) +
    '<button class="cardmain" data-edit="' + s.id + '" aria-label="Edit ' + esc(s.title) + '">' +
      '<span class="ttl"><span>' + esc(s.title) + '</span>' + (fresh ? '<span class="tag hot">' + fresh + ' new ep' + (fresh === 1 ? '' : 's') + '</span>' : '') + (s.isNew ? '<span class="tag">NEW</span>' : '') + (ty === 'tv' ? '<span class="tag tv">TV</span>' : '') + '</span>' +
      '<span class="meta">' + esc(epLine) + '</span>' +
      '<span class="bar"><i style="width:' + i.pct + '%"></i></span>' +
      '<span class="meta">' + esc(status) + behind + '</span>' +
    '</button>' +
    '<div class="side">' +
      '<button class="sbtn star' + (s.fav?' on':'') + '" data-fav="' + s.id + '" aria-pressed="' + !!s.fav + '" aria-label="Favorite ' + esc(s.title) + '"><svg width="20" height="20" viewBox="0 0 24 24" fill="' + (s.fav?'currentColor':'none') + '" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg></button>' +
      '<a class="sbtn play" href="' + esc(watchLink(s, ty)) + '" target="_blank" rel="noopener" aria-label="' + esc(watchLabel(ty) + ': ' + s.title) + '">' + ICON_PLAY + '</a>' +
      (i.finished
        ? '<button class="sbtn done" data-finish="' + s.id + '" aria-label="Move ' + esc(s.title) + ' to library">Done</button>'
        : '<button class="sbtn" data-plus="' + s.id + '" aria-label="Watched episode ' + (i.ep + 1) + ' of ' + esc(s.title) + '">+1</button>') +
    '</div></div>';
}

function chip(group, val, label, cur){
  return '<button class="chipb' + (cur===val?' on':'') + '" aria-pressed="' + (cur===val) + '" data-' + group + '="' + val + '">' + esc(label) + '</button>';
}
function syncLine(kind, entry, extra){
  if (ui.busy[kind]) return '<p class="sync">Updating' + (extra ? ' ' + esc(extra) : '') + '…</p>';
  if (ui.msg[kind]) return '<p class="sync">' + esc(ui.msg[kind]) + ' <button class="linkbtn" data-retry="' + kind + '">Try again</button></p>';
  if (entry) return '<p class="sync">Updated ' + ago(entry.at) + '. <button class="linkbtn" data-retry="' + kind + '">Refresh</button></p>';
  return '';
}

function seasonView(){
  const seg = '<div class="seg" role="group" aria-label="What to browse">' + [['anime','Anime'],['tv','TV'],['movie','Movies']].map(([k,l]) => '<button data-stype="' + k + '" aria-pressed="' + (k === ui.sType) + '">' + l + '</button>').join('') + '</div>';
  if (ui.sType === 'movie') return moviesView(seg);
  if (ui.sType === 'tv') return tvView(seg);
  return animeView(seg);
}

function haveShow(x, idKey){
  return state.shows.some(s => (x.id && s[idKey] === x.id) || norm(s.title) === norm(x.t));
}
function addButton(on, attr, val){
  return on ? '<button class="btn added" data-goto="week">On my week</button>' : '<button class="btn ghost" ' + attr + '="' + esc(val) + '">Add to my week</button>';
}
function searchBox(placeholder){
  return '<label class="vh" for="sq">' + esc(placeholder) + '</label><input id="sq" class="search" type="search" placeholder="' + esc(placeholder) + '" value="' + esc(ui.sQ) + '">';
}

function animeView(seg){
  const so = ui.sSeason === 'next' ? NEXT : CUR, key = so.season + so.year, isCur = ui.sSeason !== 'next';
  ensureAnime(so);
  const entry = cache.anime[key];
  let src = entry ? entry.items : [];
  if (ui.crOnly) src = src.filter(x => x.cr);
  if (!isCur && ui.sFilter === 'cont') ui.sFilter = 'all';
  let items = src.filter(x => ui.sFilter === 'all' || (ui.sFilter === 'new' ? x.k === 'New' : ui.sFilter === 'ret' ? x.k === 'Returning' : x.k === 'Continuing'));
  if (ui.sQ) items = items.filter(x => norm(x.t + ' ' + x.alt).includes(norm(ui.sQ)));
  const n = k => src.filter(x => x.k === k).length;
  let h = '<div class="top"><div><div class="sub">Live from AniList</div><h1>' + esc(seasonLabel(so)) + '</h1></div></div>' + seg;
  h += '<div class="chips">' + chip('sseason','cur',seasonLabel(CUR),ui.sSeason) + chip('sseason','next',seasonLabel(NEXT),ui.sSeason) +
    '<button class="chipb' + (ui.crOnly?' on':'') + '" aria-pressed="' + ui.crOnly + '" data-cronly="1">Crunchyroll only</button></div>';
  h += '<div class="chips">' + chip('sfilter','all','All ' + src.length, ui.sFilter) + chip('sfilter','new','New ' + n('New'), ui.sFilter) +
    chip('sfilter','ret','Returning ' + n('Returning'), ui.sFilter) + (isCur ? chip('sfilter','cont','Continuing ' + n('Continuing'), ui.sFilter) : '') + '</div>';
  h += syncLine('anime', entry);
  h += searchBox('Search ' + seasonLabel(so));
  if (!entry && !ui.busy.anime) return h + '<div class="empty">The lineup couldn’t load yet.</div>';
  if (!entry && ui.busy.anime) return h + '<div class="empty">Loading the ' + esc(seasonLabel(so)) + ' lineup…</div>';
  h += '<div class="grid">' + items.map(x => {
    let when;
    if (x.at){ const d = new Date(x.at); when = DAYS_FULL[d.getDay()] + 's, ' + fmtTime(hm(d)); }
    else if (x.status === 'FINISHED') when = 'Finished airing';
    else when = x.start ? 'Starts ' + fmtDate(parseDate(x.start)) : 'Date not announced';
    return '<div class="gcard"><div class="cover" style="background:' + tileColor(x.t) + '" aria-hidden="true">' + (x.cover ? '<img src="' + esc(x.cover) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : esc(initials(x.t))) + '</div>' +
      '<div class="body"><div class="name">' + esc(x.t) + '</div><div class="meta">' + esc(x.k + (x.eps ? ', ' + x.eps + ' eps' : '')) + '</div><div class="meta">' + esc(when) + '</div><div class="spacer"></div>' +
      addButton(haveShow(x, 'anilistId'), 'data-anime', x.id) + '</div></div>';
  }).join('') + '</div>';
  if (entry && !items.length) h += '<div class="empty">No shows match.' + (ui.crOnly ? ' <button class="linkbtn" data-cronly="1">Show all streaming services</button>' : '') + '</div>';
  h += '<div style="margin-top:14px"><button class="btn ghost" style="width:100%" data-act="add-show">Add a show that isn’t listed</button></div>';
  h += '<p class="note">Air times are the Japanese broadcast in your time zone. Crunchyroll usually posts the episode within an hour or so, and can be later for some shows.</p>';
  return h;
}

function tvView(seg){
  ensureTV();
  if (ui.sFilter === 'cont') ui.sFilter = 'all';
  const live = cache.tv;
  const src = live ? live.items : TV_FALLBACK;
  let items = src.filter(x => ui.sFilter === 'all' || (ui.sFilter === 'new' ? x.k === 'New' : x.k === 'Returning'));
  if (ui.sQ) items = items.filter(x => norm(x.t).includes(norm(ui.sQ)));
  const nNew = src.filter(x => x.k === 'New').length, t0 = today();
  let h = '<div class="top"><div><div class="sub">Live from TVmaze</div><h1>TV premieres</h1></div></div>' + seg;
  h += '<div class="chips">' + chip('sfilter','all','All ' + src.length, ui.sFilter) + chip('sfilter','new','New ' + nNew, ui.sFilter) + chip('sfilter','ret','Returning ' + (src.length - nNew), ui.sFilter) + '</div>';
  h += syncLine('tv', live, ui.msg.tvProgress ? '(' + ui.msg.tvProgress + ')' : '');
  if (!live && ui.busy.tv) h += '<p class="sync">The first update takes about half a minute. Here’s a saved list in the meantime.</p>';
  h += searchBox('Search TV premieres');
  h += '<div class="grid">' + items.map(x => {
    const pd = parseDate(x.p), d = pd ? pd.getDay() : 0;
    const when = !pd ? 'Date not announced' : x.full ? (pd <= t0 ? 'All episodes out ' : 'All episodes ') + fmtDate(pd) : DAYS_FULL[d] + 's, ' + (pd <= t0 ? 'since ' : 'from ') + fmtDate(pd);
    return '<div class="gcard"><div class="cover" style="background:' + tileColor(x.t) + '" aria-hidden="true">' + (x.cover ? '<img src="' + esc(x.cover) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : esc(initials(x.t))) + '</div>' +
      '<div class="body"><div class="name">' + esc(x.t) + '</div><div class="meta">' + esc(x.k + (x.w ? ', ' + x.w : '')) + '</div><div class="meta">' + esc(when) + '</div><div class="spacer"></div>' +
      addButton(haveShow(x, 'tvmazeId'), 'data-tvshow', x.t) + '</div></div>';
  }).join('') + '</div>';
  if (!items.length) h += '<div class="empty">No shows match.</div>';
  h += '<div style="margin-top:14px"><button class="btn ghost" style="width:100%" data-act="add-show">Add a show that isn’t listed</button></div>';
  h += '<p class="note">Premieres from the last week and the next three weeks, U.S. networks and streaming. Streaming shows usually drop the same day in Canada.</p>';
  return h;
}

function moviesView(seg){
  ensureMovies();
  const live = relayOn() ? cache.movies : null, t0 = today();
  const onList = new Set(state.watchlist.map(m => norm(m.title)));
  const seen = new Set(state.library.filter(x => typeOf(x) === 'movie').map(x => norm(x.title)));
  let items = (live ? live.items : MOVIES_FALLBACK).slice();
  if (ui.mFilter === 'soon') items = items.filter(m => parseDate(m.d) > t0);
  if (ui.mFilter === 'out') items = items.filter(m => parseDate(m.d) <= t0);
  if (ui.sQ) items = items.filter(m => norm(m.t).includes(norm(ui.sQ)));
  let h = '<div class="top"><div><div class="sub">' + (live ? 'Live from TMDB, Canadian dates' : 'In theaters and streaming') + '</div><h1>Movies</h1></div></div>' + seg;
  h += '<div class="chips">' + chip('mfilter','all','All',ui.mFilter) + chip('mfilter','soon','Coming soon',ui.mFilter) + chip('mfilter','out','Out now',ui.mFilter) + '</div>';
  if (!relayOn()) h += '<p class="sync">This is a saved list. Live movie dates aren’t switched on yet.</p>';
  else h += syncLine('movies', live);
  h += searchBox('Search movies');
  h += '<div class="list">' + items.map(m => {
    const key = norm(m.t);
    const btn = seen.has(key) ? '<span class="meta" style="padding:0 6px">Seen</span>'
      : onList.has(key) ? '<button class="btn added" style="min-height:40px;font-size:13px;padding:0 12px" data-goto="week">On my list</button>'
      : '<button class="btn ghost" style="min-height:40px;font-size:13px;padding:0 12px" data-movie="' + esc(m.t) + '">Add to list</button>';
    return '<div class="card">' + tile(m.t, m.cover) +
      '<div class="cardmain"><span class="ttl"><span>' + esc(m.t) + '</span></span><span class="meta">' + esc(whenText(m.d)) + '</span><span class="meta">' + esc(m.w) + '</span></div>' + btn + '</div>';
  }).join('') + '</div>';
  if (!items.length) h += '<div class="empty">No movies match.</div>';
  h += '<div style="margin-top:14px"><button class="btn ghost" style="width:100%" data-act="add-movie">Add a movie that isn’t listed</button></div>';
  return h;
}

function libraryView(){
  const all = state.library;
  const lib = all.filter(x => typeOf(x) === ui.lType);
  const isMovie = ui.lType === 'movie';
  const eps = lib.reduce((a,x) => a + (Number(x.eps)||0), 0);
  const favs = lib.filter(x => x.fav).length;
  let items = lib.filter(x => ui.lFilter==='all' || (ui.lFilter==='fav' ? x.fav : ui.lFilter==='rated' ? (Number(x.rating)||0) >= 4 : x.status === ui.lFilter));
  if (ui.lQ) items = items.filter(x => norm(x.title).includes(norm(ui.lQ)));
  items.sort((a,b) => a.title.localeCompare(b.title));
  let h = '<div class="top"><div><div class="sub">Everything you’ve watched</div><h1>Library</h1></div>' +
    '<div style="display:flex;gap:8px"><button class="iconbtn" data-act="year" aria-label="Year in review">' + ICON_CHART + '</button><button class="btn ghost" data-act="import">Import</button>' +
    '<button class="iconbtn" data-act="add-lib" aria-label="Find a title to add"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div>';
  h += '<div class="seg" role="group" aria-label="Library type">' + Object.keys(TYPES).map(k => '<button data-ltype="' + k + '" aria-pressed="' + (k === ui.lType) + '">' + TYPES[k] + ' <span>' + all.filter(x => typeOf(x) === k).length + '</span></button>').join('') + '</div>';
  h += '<div class="stats"><div class="stat"><span class="v">' + lib.length + '</span><span class="k">' + (isMovie ? 'Movies' : 'Shows') + '</span></div><div class="stat"><span class="v">' + (isMovie ? lib.filter(x => x.status !== 'dropped').length : eps) + '</span><span class="k">' + (isMovie ? 'Finished' : 'Episodes') + '</span></div><div class="stat"><span class="v" style="color:var(--accent-ink)">' + favs + '</span><span class="k">Favorites</span></div></div>';
  h += '<label class="vh" for="lq">Search your library</label><input id="lq" class="search" type="search" placeholder="Search your library" value="' + esc(ui.lQ) + '">';
  h += '<div class="chips">' + chip('lfilter','all','All',ui.lFilter) + chip('lfilter','fav','Favorites',ui.lFilter) + chip('lfilter','rated','Top rated',ui.lFilter) + chip('lfilter','completed','Completed',ui.lFilter) + chip('lfilter','dropped','Dropped',ui.lFilter) + '</div>';
  if (!lib.length){
    h += '<div class="empty"><div>' + (ui.lType === 'anime' ? 'Finished shows from your week land here. You can also bring in your Excel list.' : 'No ' + (ui.lType === 'tv' ? 'TV shows' : 'movies') + ' yet. Tap + to find any title, old or new, or bring in your Excel list.') + '</div><button class="btn" data-act="import">Import from Excel</button></div>';
  } else if (!items.length){
    h += '<div class="empty">Nothing matches.</div>';
  } else {
    h += '<div class="rows">' + items.map(x => {
      const bits = [x.season, x.eps ? x.eps + ' eps' : '', x.status === 'dropped' ? 'Dropped' : ''].filter(Boolean).join(', ');
      return '<button class="row" data-libedit="' + x.id + '"><span class="tile" style="background:' + tileColor(x.title) + '" aria-hidden="true">' + (x.cover ? '<img src="' + esc(x.cover) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : esc(initials(x.title))) + '</span>' +
        '<span class="info"><span>' + esc(x.title) + '</span><span class="meta">' + (x.rating ? '<span class="stars" aria-label="' + x.rating + ' out of 5">' + stars(x.rating) + '</span> ' : '') + esc(bits || (x.rating ? '' : 'No details yet')) + '</span>' + (x.note ? '<span class="meta notep">' + esc(x.note) + '</span>' : '') + '</span>' +
        (x.fav ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="color:var(--accent-ink);flex-shrink:0" role="img" aria-label="Favorite"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>' : '') +
        '</button>';
    }).join('') + '</div>';
  }
  return h;
}

/* ---------- Sheets ---------- */
function openSheet(html, onMount){
  const m = $('#modal');
  m.innerHTML = '<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';
  const first = m.querySelector('input,select,textarea,button');
  if (first) first.focus();
  if (onMount) onMount(m.querySelector('.sheet'));
}
function closeSheet(){ $('#modal').innerHTML = ''; }

function libSheet(x, isNewEntry){
  openSheet(
    '<h2>' + (isNewEntry ? 'Add to library' : 'Edit entry') + '</h2>' +
    '<div class="field"><label for="l-title">Title</label><input id="l-title" value="' + esc(x.title) + '"><span class="linked" id="l-linked"></span></div>' +
    '<div class="field"><label for="l-type">Type</label><select id="l-type">' + typeOptions(typeOf(x)) + '</select></div>' +
    '<div class="two"><div class="field"><label for="l-season">Season</label><input id="l-season" placeholder="e.g. Fall 2026" value="' + esc(x.season||'') + '"></div>' +
    '<div class="field"><label for="l-eps">Episodes</label><input id="l-eps" type="number" inputmode="numeric" min="0" value="' + (x.eps||'') + '"></div></div>' +
    '<div class="field"><label for="l-status">Status</label><select id="l-status"><option value="completed"' + (x.status!=='dropped'?' selected':'') + '>Completed</option><option value="dropped"' + (x.status==='dropped'?' selected':'') + '>Dropped</option></select></div>' +
    '<label class="check"><input id="l-fav" type="checkbox"' + (x.fav?' checked':'') + '> Favorite</label>' +
    '<div class="field"><span class="flabel">Your rating</span>' + starPicker(Number(x.rating) || 0) + '</div>' +
    '<div class="field"><label for="l-note">Note</label><textarea id="l-note" class="note-in" placeholder="What stood out?">' + esc(x.note || '') + '</textarea></div>' +
    '<div class="actions"><button class="btn ghost" data-close="1">Cancel</button><button class="btn" id="l-save">' + (isNewEntry ? 'Add' : 'Save changes') + '</button></div>' +
    (isNewEntry ? '' : '<div class="actions"><button class="btn danger" id="l-del">Delete from library</button></div>'),
    sheet => {
      let rv = Number(x.rating) || 0, picked = null;
      bindStars(sheet, v => v === undefined ? rv : (rv = v));
      attachSuggest(sheet, '#l-title', () => $('#l-type', sheet).value, p => {
        picked = p; linkedNote(sheet, 'l-linked', p);
        if (p){ if (!$('#l-season', sheet).value && p.year) $('#l-season', sheet).value = p.year; if (!$('#l-eps', sheet).value && p.eps) $('#l-eps', sheet).value = p.eps; }
      });
      $('#l-type', sheet).addEventListener('change', () => { picked = null; linkedNote(sheet, 'l-linked', null); });
      $('#l-save', sheet).addEventListener('click', () => {
        const title = $('#l-title', sheet).value.trim();
        if (!title){ toast('Add a title first'); return; }
        if (norm(title) !== norm(x.title) || $('#l-type', sheet).value !== typeOf(x)){ x.cover = ''; x.coverChecked = false; }
        Object.assign(x, { title, type: $('#l-type', sheet).value, season: $('#l-season', sheet).value.trim(), eps: parseInt($('#l-eps', sheet).value,10) || null, status: $('#l-status', sheet).value, fav: $('#l-fav', sheet).checked, rating: rv || null, note: $('#l-note', sheet).value.trim() });
        if (picked && norm(picked.t) === norm(title) && picked.type === x.type) applyPick(x, picked);
        if (isNewEntry) state.library.push(x);
        save(); closeSheet(); render(); enrichLibrary();
      });
      if (!isNewEntry) $('#l-del', sheet).addEventListener('click', () => {
        if (!confirm('Delete ' + x.title + ' from your library?')) return;
        state.library = state.library.filter(y => y.id !== x.id); save(); closeSheet(); render();
      });
    }
  );
}

function importSheet(){
  openSheet(
    '<h2>Import from Excel</h2>' +
    '<p class="meta" style="margin:0">In Excel, select your rows and copy them, then paste here. Columns in this order: Title, Season, Episodes, Favorite (Y or yes). Only Title is needed; a header row is skipped.</p>' +
    '<div class="field"><label for="imp-type">Import into</label><select id="imp-type">' + typeOptions(ui.lType) + '</select></div>' +
    '<div class="field"><label for="imp">Pasted rows</label><textarea id="imp" placeholder="Title	Season	Episodes	Favorite"></textarea></div>' +
    '<div class="actions"><button class="btn ghost" data-close="1">Cancel</button><button class="btn" id="imp-go">Import rows</button></div>',
    sheet => {
      $('#imp-go', sheet).addEventListener('click', () => {
        const lines = $('#imp', sheet).value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const typ = $('#imp-type', sheet).value;
        const have = new Set(state.library.filter(x => typeOf(x) === typ).map(x => norm(x.title)));
        let added = 0, dup = 0;
        lines.forEach((line, idx) => {
          const c = line.split('\t').map(v => v.trim());
          if (idx === 0 && norm(c[0]) === 'title') return;
          if (!c[0]) return;
          if (have.has(norm(c[0]))){ dup++; return; }
          have.add(norm(c[0]));
          state.library.push({ id: uid(), type: typ, title: c[0], season: c[1]||'', eps: parseInt(c[2],10) || null, fav: /^(y|yes|x|true|1|★)$/i.test(c[3]||''), status:'completed' });
          added++;
        });
        if (!added && !dup){ toast('Paste at least one row first'); return; }
        ui.lType = typ; ui.lFilter = 'all'; ui.lQ = '';
        save(); closeSheet(); render();
        enrichLibrary();
        toast('Imported ' + added + (dup ? ', skipped ' + dup + ' already in library' : ''));
      });
    }
  );
}

function showSheet(s, isNewEntry){
  const dayOpts = '<option value="">Not set</option>' + DAYS_FULL.map((d,i) => '<option value="' + i + '"' + (s.day===i?' selected':'') + '>' + d + '</option>').join('');
  const L = s.live, linked = s.anilistId || s.tvmazeId;
  const autoTotal = L && L.total ? L.total + (Number(s.epOffset) || 0) : null;
  const linkLine = linked
    ? '<p class="meta" style="margin:0">Episode info from ' + (s.anilistId ? 'AniList' : 'TVmaze') + (s.linkTitle ? ': ' + esc(s.linkTitle) : '') + '. <button class="linkbtn" id="f-unlink">Wrong show? Unlink it</button></p>'
    : (!isNewEntry && s.noLink ? '<p class="meta" style="margin:0">No live episode info found for this title. <button class="linkbtn" id="f-relink">Search again</button></p>' : '');
  openSheet(
    '<h2>' + (isNewEntry ? 'Add to my week' : 'Edit show') + '</h2>' + linkLine +
    (isNewEntry ? '' : '<a class="btn ghost" href="' + esc(watchLink(s, typeOf(s))) + '" target="_blank" rel="noopener">' + watchLabel(typeOf(s)) + '</a>') +
    '<div class="field"><label for="f-title">Title</label><input id="f-title" value="' + esc(s.title) + '" required><span class="linked" id="f-linked"></span></div>' +
    '<div class="two"><div class="field"><label for="f-day">Day</label><select id="f-day">' + dayOpts + '</select></div>' +
    '<div class="field"><label for="f-time">Time</label><input id="f-time" type="time" value="' + esc(s.time||'') + '"></div></div>' +
    '<div class="two"><div class="field"><label for="f-ep">Next episode</label><input id="f-ep" type="number" inputmode="numeric" min="1" value="' + ((Number(s.ep)||0) + 1) + '"></div>' +
    '<div class="field"><label for="f-total">Total episodes</label><input id="f-total" type="number" inputmode="numeric" min="1" ' +
      (autoTotal ? 'placeholder="' + autoTotal + ' (auto)" disabled' : 'placeholder="Unknown" value="' + (s.total||'') + '"') + '></div></div>' +
    (linked ? '<div class="field"><label for="f-off">Your episode numbers run ahead by</label><input id="f-off" type="number" inputmode="numeric" min="0" value="' + (Number(s.epOffset)||0) + '"><span class="meta">For sequels numbered from the first season, like Black Clover’s episode 175. Set automatically; change it if it’s off.</span></div>' : '') +
    '<div class="two"><div class="field"><label for="f-prem">First episode date</label><input id="f-prem" type="date" value="' + esc(s.premiere||'') + '"></div>' +
    '<div class="field"><label for="f-kind">Type</label><select id="f-kind"><option value="new"' + (s.isNew?' selected':'') + '>New</option><option value="ret"' + (!s.isNew?' selected':'') + '>Returning</option></select></div></div>' +
    '<label class="check"><input id="f-fav" type="checkbox"' + (s.fav?' checked':'') + '> Favorite this season</label>' +
    '<div class="actions"><button class="btn ghost" data-close="1">Cancel</button><button class="btn" id="f-save">' + (isNewEntry ? 'Add show' : 'Save changes') + '</button></div>' +
    (isNewEntry ? '' : '<div class="actions"><button class="btn ghost" id="f-finish">Move to library</button><button class="btn danger" id="f-del">Remove</button></div>'),
    sheet => {
      let picked = null;
      attachSuggest(sheet, '#f-title', () => typeOf(s), p => {
        picked = p; linkedNote(sheet, 'f-linked', p);
        if (p && p.next){ const at = new Date(p.next.airingAt * 1000); if ($('#f-day', sheet).value === '') $('#f-day', sheet).value = at.getDay(); if (!$('#f-time', sheet).value) $('#f-time', sheet).value = hm(at); }
      });
      $('#f-prem', sheet).addEventListener('change', e => { const d = dayFromDate(e.target.value); if (d != null && $('#f-day', sheet).value === '') $('#f-day', sheet).value = d; });
      $('#f-save', sheet).addEventListener('click', () => {
        const title = $('#f-title', sheet).value.trim();
        if (!title){ $('#f-title', sheet).focus(); toast('Add a title first'); return; }
        const renamed = !isNewEntry && norm(title) !== norm(s.title);
        const dv = $('#f-day', sheet).value;
        Object.assign(s, {
          title, day: dv === '' ? null : Number(dv), time: $('#f-time', sheet).value,
          ep: Math.max(0, (parseInt($('#f-ep', sheet).value,10) || 1) - 1),
          premiere: $('#f-prem', sheet).value, isNew: $('#f-kind', sheet).value === 'new', fav: $('#f-fav', sheet).checked
        });
        if (!autoTotal) s.total = parseInt($('#f-total', sheet).value,10) || null;
        const offEl = $('#f-off', sheet); if (offEl) s.epOffset = Math.max(0, parseInt(offEl.value,10) || 0);
        if (renamed){ s.anilistId = null; s.tvmazeId = null; s.live = null; s.linkTitle = ''; s.noLink = false; s.epOffset = null; s.cover = ''; }
        const usePick = picked && norm(picked.t) === norm(title) && picked.type === typeOf(s);
        if (usePick){
          applyPick(s, picked); s.linkTitle = picked.t; s.noLink = false; s.epOffset = null; s.live = null;
          s.backlog = picked.status === 'FINISHED';
          if (picked.type === 'anime'){ const n = picked.next; s.live = { total: picked.eps, aired: n ? n.episode - 1 : (picked.status === 'FINISHED' ? picked.eps : 0), at: n ? n.airingAt * 1000 : null, status: picked.status }; }
          delete s.tmdbId;
        }
        if (isNewEntry){ state.shows.push(s); if (s.day != null) ui.day = s.day; }
        save(); closeSheet(); render();
        if (isNewEntry) toast('Added ' + title);
        if (isNewEntry || renamed || usePick) refreshShows(true);
      });
      const un = $('#f-unlink', sheet);
      if (un) un.addEventListener('click', () => {
        Object.assign(s, { anilistId:null, tvmazeId:null, live:null, linkTitle:'', noLink:true, epOffset:null, cover:'' });
        save(); closeSheet(); render(); toast('Unlinked. Episode info is manual for this show now.');
      });
      const re = $('#f-relink', sheet);
      if (re) re.addEventListener('click', () => { s.noLink = false; s.epOffset = null; save(); closeSheet(); refreshShows(true); });
      if (!isNewEntry){
        $('#f-del', sheet).addEventListener('click', () => {
          if (!confirm('Remove ' + s.title + ' from your week?')) return;
          state.shows = state.shows.filter(x => x.id !== s.id); save(); closeSheet(); render(); toast('Removed ' + s.title);
        });
        $('#f-finish', sheet).addEventListener('click', () => { closeSheet(); finishShow(s.id, true); });
      }
    }
  );
}

function settingsSheet(){
  openSheet(
    '<h2>Settings</h2>' +
    alertsSection() +
    syncSection() +
    '<h2 style="margin-top:4px">Your data</h2>' +
    '<p class="meta" style="margin:0">' + (syncOn() ? 'Saved on this device and synced with your code. A backup file is still handy now and then.' : 'Everything is saved on this device only. Download a backup now and then, and use it to move to a new phone.') + '</p>' +
    '<div class="actions"><button class="btn ghost" id="s-export">Download backup</button>' +
    '<label class="btn ghost" style="display:flex;align-items:center;justify-content:center;cursor:pointer">Restore backup<input id="s-import" type="file" accept=".json,application/json" class="vh"></label></div>' +
    '<div class="actions"><button class="btn ghost" id="s-refresh">Refresh all live data</button></div>' +
    '<p class="note" style="margin:4px 0 0">Anime data from <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a>. TV data from <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a> (CC BY-SA). This product uses the TMDB API but is not endorsed or certified by TMDB.</p>' +
    '<div class="actions"><button class="btn ghost" data-close="1">Close</button></div>',
    sheet => {
      bindSync(sheet);
      bindAlerts(sheet);
      $('#s-export', sheet).addEventListener('click', () => {
        const blob = new Blob([JSON.stringify({ app:'airday', v:2, exportedAt:new Date().toISOString(), state }, null, 1)], { type:'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'airday-backup-' + ymd(new Date()) + '.json';
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      });
      $('#s-import', sheet).addEventListener('change', async e => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        try {
          const j = JSON.parse(await f.text());
          const incoming = j.state ? j.state : (typeof j.json === 'string' ? JSON.parse(j.json) : j);
          if (!incoming || (!Array.isArray(incoming.shows) && !Array.isArray(incoming.library))) throw new Error('shape');
          const n = (incoming.shows||[]).length, m = (incoming.library||[]).length;
          if ((state.shows.length || state.library.length) && !confirm('Replace what’s on this device with the backup (' + n + ' shows, ' + m + ' library titles)?')) return;
          state = Object.assign(blank(), incoming); cache.showsAt = 0; save(); saveCache();
          closeSheet(); render(); toast('Restored ' + n + ' shows and ' + m + ' library titles'); setTimeout(enrichLibrary, 4000);
          refreshShows(true);
        } catch(err){ toast('That file isn’t an Airday backup.'); }
      });
      $('#s-refresh', sheet).addEventListener('click', () => {
        closeSheet(); cache.anime = {}; cache.tv = null; cache.movies = null; cache.showsAt = 0; saveCache();
        refreshShows(true); render(); toast('Refreshing. TV premieres take about half a minute.');
      });
    }
  );
}

function movieSheet(){
  openSheet(
    '<h2>Add a movie</h2>' +
    '<div class="field"><label for="m-title">Title</label><input id="m-title"><span class="linked" id="m-linked"></span></div>' +
    '<div class="two"><div class="field"><label for="m-date">Release date</label><input id="m-date" type="date"></div>' +
    '<div class="field"><label for="m-where">Where</label><input id="m-where" placeholder="Theaters, Netflix…"></div></div>' +
    '<div class="actions"><button class="btn ghost" data-close="1">Cancel</button><button class="btn" id="m-save">Add to list</button></div>',
    sheet => {
      let picked = null;
      attachSuggest(sheet, '#m-title', () => 'movie', p => { picked = p; linkedNote(sheet, 'm-linked', p); if (p && p.date) $('#m-date', sheet).value = p.date; });
      $('#m-save', sheet).addEventListener('click', () => {
        const title = $('#m-title', sheet).value.trim();
        if (!title){ $('#m-title', sheet).focus(); toast('Add a title first'); return; }
        const usePick = picked && norm(picked.t) === norm(title);
        state.watchlist.push({ id: uid(), title, date: $('#m-date', sheet).value, where: $('#m-where', sheet).value.trim(), cover: usePick ? (picked.cover || '') : '' });
        save(); closeSheet(); render(); toast('Added ' + title + ' to your list');
      });
    }
  );
}

function finishShow(id, fromSheet){
  const s = state.shows.find(x => x.id === id);
  if (!s) return;
  const i = showInfo(s);
  const status = i.finished ? 'completed' : (fromSheet && confirm('Mark ' + s.title + ' as dropped? Cancel keeps it as completed.') ? 'dropped' : 'completed');
  const entry = moveToLibrary(s, status);
  save(); render();
  rateSheet(entry, s.title + ' moved to your library.');
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-close]');
  if (!t) return;
  if (t.dataset.close && (t === e.target || t.tagName === 'BUTTON')){ if (t.classList.contains('scrim') && e.target !== t) return; closeSheet(); return; }
  const d = t.dataset;
  if (d.tab){ if (ui.tab === 'week' && d.tab !== 'week') markSeen(); ui.tab = d.tab; render(); window.scrollTo(0,0); if (d.tab === 'week') refreshShows(false); return; }
  if (d.goto){ if (ui.tab === 'week' && d.goto !== 'week') markSeen(); ui.tab = d.goto; render(); window.scrollTo(0,0); return; }
  if (d.year){ yearSheet(d.year); return; }
  if (d.frdel){
    const fr = (state.friends || []).find(f => f.id === d.frdel); if (!fr) return;
    if (!confirm('Remove ' + ((ui.friendData[fr.id] || {}).name || fr.name) + ' from your friends?')) return;
    state.friends = state.friends.filter(f => f.id !== fr.id); save(); render(); return;
  }
  if (d.fradd){
    const [fid, n] = d.fradd.split(':'); const fd = ui.friendData[fid]; const x = fd && fd.data && (fd.data.shows || [])[Number(n)]; if (!x) return;
    showSheet({ id: uid(), type: x.ty === 'tv' ? 'tv' : 'anime', title: x.t, anilistId: x.a || null, tvmazeId: x.m || null, cover: x.c || '', day: x.d >= 0 ? x.d : null, time:'', ep:0, total:null, premiere:'', isNew: !!x.k, fav:false }, true);
    return;
  }
  if (d.act === 'wrapup'){ wrapSheet(); return; }
  if (d.act === 'wrap-later'){ settings.wrapSeen = endedKey(); saveSettings(); render(); return; }
  if (d.act === 'season-new'){ settings.seasonSeen = CUR.season + CUR.year; saveSettings(); markSeen(); ui.tab = 'season'; ui.sType = 'anime'; ui.sSeason = 'cur'; render(); window.scrollTo(0,0); return; }
  if (d.act === 'season-ok'){ settings.seasonSeen = CUR.season + CUR.year; saveSettings(); render(); return; }
  if (d.act === 'year'){ yearSheet(); return; }
  if (['share-start','share-link','share-stop','friend-add'].includes(d.act)){ friendAction(d.act); return; }
  if (d.day != null){ ui.day = Number(d.day); render(); return; }
  if (d.stype){ ui.sType = d.stype; ui.sFilter = 'all'; ui.sQ = ''; render(); return; }
  if (d.sseason){ ui.sSeason = d.sseason; ui.sFilter = 'all'; render(); return; }
  if (d.cronly){ ui.crOnly = !ui.crOnly; render(); return; }
  if (d.sfilter){ ui.sFilter = d.sfilter; render(); return; }
  if (d.mfilter){ ui.mFilter = d.mfilter; render(); return; }
  if (d.lfilter){ ui.lFilter = d.lfilter; render(); return; }
  if (d.ltype){ ui.lType = d.ltype; render(); return; }
  if (d.retry){
    if (d.retry === 'anime') ensureAnime(ui.sSeason === 'next' ? NEXT : CUR, true);
    if (d.retry === 'tv') ensureTV(true);
    if (d.retry === 'movies') ensureMovies(true);
    render(); return;
  }
  if (d.plus){
    const s = state.shows.find(x => x.id === d.plus); if (!s) return;
    s.ep = (Number(s.ep)||0) + 1;
    logEvent('ep', s.title, { ty: typeOf(s) });
    const tot = showInfo(s).total; if (tot) s.ep = Math.min(s.ep, tot);
    save(); render();
    if (tot && s.ep >= tot) toast('Finished ' + s.title + '. Tap Done to move it to your library.');
    return;
  }
  if (d.fav){ const s = state.shows.find(x => x.id === d.fav); if (s){ s.fav = !s.fav; save(); render(); } return; }
  if (d.finish){ finishShow(d.finish, false); return; }
  if (d.edit){ const s = state.shows.find(x => x.id === d.edit); if (s) showSheet(s, false); return; }
  if (d.libedit){ const x = state.library.find(y => y.id === d.libedit); if (x) libSheet(x, false); return; }
  if (d.anime){
    const so = ui.sSeason === 'next' ? NEXT : CUR, entry = cache.anime[so.season + so.year];
    const x = entry && entry.items.find(y => String(y.id) === d.anime); if (!x) return;
    const at = x.at ? new Date(x.at) : null;
    const s = { id: uid(), type:'anime', title: x.t, anilistId: x.id, linkTitle: x.t, cover: x.thumb || x.cover, day: at ? at.getDay() : dayFromDate(x.start),
      time: at ? hm(at) : '', ep:0, total:null, premiere: x.start, isNew: x.k === 'New', fav:false, epOffset:0, genres: x.genres || [],
      live: { total: x.eps, aired: x.next ? x.next - 1 : (x.status === 'FINISHED' ? x.eps : 0), at: x.at, status: x.status } };
    showSheet(s, true);
    return;
  }
  if (d.tvshow){
    const src = cache.tv ? cache.tv.items : TV_FALLBACK;
    const x = src.find(y => y.t === d.tvshow); if (!x) return;
    showSheet({ id: uid(), type:'tv', title: x.t, tvmazeId: x.id || null, cover: x.cover || '', day: dayFromDate(x.p), time:'', ep:0, total:null, premiere: x.p, isNew: x.k === 'New', fav:false }, true);
    return;
  }
  if (d.movie){
    const src = relayOn() && cache.movies ? cache.movies.items : MOVIES_FALLBACK;
    const m = src.find(y => y.t === d.movie); if (!m) return;
    state.watchlist.push({ id: uid(), title: m.t, date: m.d, where: m.w, cover: m.cover || '' }); save(); render(); toast('Added ' + m.t + ' to your list');
    return;
  }
  if (d.wdone){
    const m = state.watchlist.find(y => y.id === d.wdone); if (!m) return;
    let entry = state.library.find(x => typeOf(x) === 'movie' && norm(x.title) === norm(m.title));
    if (!entry){ entry = { id: uid(), type:'movie', title: m.title, season: m.date ? m.date.slice(0,4) : '', eps:null, fav:false, status:'completed', cover: m.cover || '', coverChecked: !!m.cover }; state.library.push(entry); }
    entry.doneAt = Date.now(); logEvent('movie', m.title, { ty:'movie' });
    state.watchlist = state.watchlist.filter(y => y.id !== m.id); save(); render();
    rateSheet(entry, m.title + ' moved to your library.');
    return;
  }
  if (d.wdel){ state.watchlist = state.watchlist.filter(y => y.id !== d.wdel); save(); render(); return; }
  if (d.act === 'settings'){ settingsSheet(); return; }
  if (d.act === 'add-movie'){ findSheet('movie', 'week'); return; }
  if (d.act === 'add-show'){ findSheet((ui.tab === 'season' && ui.sType === 'tv') ? 'tv' : 'anime', 'week'); return; }
  if (d.act === 'add-lib'){ findSheet(ui.lType, 'library'); return; }
  if (d.act === 'import'){ importSheet(); return; }
});
let searchTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'sq' || e.target.id === 'lq'){
    if (e.target.id === 'sq') ui.sQ = e.target.value; else ui.lQ = e.target.value;
    clearTimeout(searchTimer); searchTimer = setTimeout(render, 150);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){ render(); pullSync().then(() => refreshShows(false)); }
  else { if (ui.tab === 'week') markSeen(); if (settings.sync && settings.sync.dirty){ clearTimeout(syncTimer); pushSync(); } if (state.share){ clearTimeout(pubTimer); publishShare(); } }
});

if (!settings.seasonSeen){ settings.seasonSeen = CUR.season + CUR.year; saveSettings(); }
render();
pullSync().then(() => { refreshShows(false); handleInvite(); });
setTimeout(enrichLibrary, 3000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
