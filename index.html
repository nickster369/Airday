<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Airday">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12131A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Airday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --chip:#E7E9F0; --line:#DDE0E8; --track:#E1E3EA;
  --text:#15161D; --muted:#5A5E6E; --accent:#FF9A52; --on-accent:#12131A; --accent-ink:#A84B0B;
  --new-bg:#DCE6FF; --new-ink:#24407F; --danger:#B3261E; --scrim:rgba(10,11,16,.55);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12131A; --surface:#1C1E28; --chip:#1F2230; --line:#262938; --track:#2A2D3B;
    --text:#F2F2F5; --muted:#A3A7B7; --accent:#FF9A52; --on-accent:#12131A; --accent-ink:#FF9A52;
    --new-bg:#2C3A5C; --new-ink:#B9CCFF; --danger:#FF8A80; --scrim:rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12131A; --surface:#1C1E28; --chip:#1F2230; --line:#262938; --track:#2A2D3B;
  --text:#F2F2F5; --muted:#A3A7B7; --accent:#FF9A52; --on-accent:#12131A; --accent-ink:#FF9A52;
  --new-bg:#2C3A5C; --new-ink:#B9CCFF; --danger:#FF8A80; --scrim:rgba(0,0,0,.6);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{padding:24px 4px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sub{font-size:13px;color:var(--muted);font-weight:500}
h1{margin:2px 0 0;font-family:'Space Grotesk',system-ui,sans-serif;font-size:30px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;font-size:18px;font-weight:700}
.iconbtn{width:44px;height:44px;border-radius:22px;border:none;background:var(--chip);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:4px 0 18px}
.day{height:64px;border-radius:14px;border:none;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.day .l{font-size:12px;color:var(--muted);font-weight:500}
.day .n{font-size:18px;font-weight:600}
.day.on{background:var(--accent);color:var(--on-accent)}
.day.on .l{color:var(--on-accent);font-weight:600}
.day.today::after{content:"";position:absolute;bottom:7px;width:4px;height:4px;border-radius:2px;background:currentColor}
.sechead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.tile{width:54px;height:76px;border-radius:10px;color:#12131A;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cardmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;background:none;border:none;padding:0;text-align:left}
.ttl{font-weight:600;font-size:15px;display:flex;gap:6px;align-items:center;min-width:0}
.ttl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--new-bg);color:var(--new-ink);flex-shrink:0}
.meta{font-size:12px;color:var(--muted)}
.meta b{color:var(--accent-ink);font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:5px;background:var(--accent);border-radius:3px}
.side{display:flex;flex-direction:column;gap:6px}
.sbtn{width:44px;height:38px;border:none;border-radius:10px;background:var(--chip);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.star{background:transparent;color:var(--muted)}
.star.on{color:var(--accent-ink)}
.done{width:auto;padding:0 10px;background:var(--accent);color:var(--on-accent);font-size:12px}
.empty{background:var(--surface);border-radius:16px;padding:22px 18px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:none;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.chipb{min-height:36px;padding:0 14px;border-radius:18px;border:none;background:var(--chip);font-weight:500;font-size:13px}
.chipb.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:15px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.gcard .cover{height:118px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:28px;color:#12131A}
.gcard .body{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.gcard .name{font-weight:600;font-size:14px;line-height:1.25}
.gcard .btn{margin-top:auto;min-height:40px;font-size:13px}
.gcard .spacer{flex:1;min-height:8px}
.added{background:transparent;color:var(--accent-ink);border:1px solid var(--accent-ink)}
.note{font-size:12px;color:var(--muted);margin:14px 4px 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.stat{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:'Space Grotesk',system-ui,sans-serif;font-size:22px;font-weight:700}
.stat .k{font-size:12px;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row .tile{width:40px;height:54px;font-size:15px;border-radius:8px}
.row .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .info span:first-child{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{min-height:48px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent-ink);font-weight:600}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 12px;font-size:16px;width:100%}
.field textarea{min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;gap:10px;align-items:center;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
.tag.tv{background:var(--chip);color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--chip);margin:4px 0 14px}
.seg button{min-height:40px;border:none;border-radius:9px;background:transparent;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600}
.seg button span{font-weight:500;color:var(--muted)}
.tile,.gcard .cover{overflow:hidden}
.tile img,.gcard .cover img{width:100%;height:100%;object-fit:cover;display:block}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.gcard .cover{height:auto;aspect-ratio:2/3}
.day.hasnew::before{content:"";position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:4px;background:var(--accent)}
.day.on.hasnew::before{background:var(--on-accent)}
.tag.hot{background:var(--accent);color:var(--on-accent)}
.tag.fav{background:var(--chip);color:var(--accent-ink)}
.banner{background:var(--surface);border-radius:16px;padding:14px;margin:0 0 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.banner.hot{border:1px solid var(--accent)}
.banner .actions{margin:0}
.side .sbtn{height:34px}
.sbtn.play{color:var(--accent-ink);background:transparent;text-decoration:none}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
a.wlink{color:var(--accent-ink);text-decoration:underline}
.stars{color:var(--accent-ink);letter-spacing:1px}
.row .info .notep{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.stars-pick{display:flex;gap:6px}
.starbtn{width:44px;height:44px;border:none;border-radius:10px;background:var(--chip);color:var(--muted);display:flex;align-items:center;justify-content:center}
.starbtn.on{color:var(--accent-ink)}
.field textarea.note-in{min-height:84px;font-family:inherit;font-size:15px}
.flabel{font-size:13px;color:var(--muted);font-weight:500}
.panel{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.panel .actions{margin:0}
.codebox.small{font-size:13px;letter-spacing:0}
.friend{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px}
.friend .fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.friend .card{background:var(--bg);padding:10px}
.friend .tile{width:40px;height:56px;font-size:14px}
.frlist{display:flex;flex-direction:column;gap:8px}
.btn.small{min-height:40px;font-size:13px;padding:0 14px}
.wraprow{display:flex;gap:12px;align-items:flex-start}
.wraprow .info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.wraprow .name{font-weight:600}
.wraprow .tile{width:44px;height:62px}
.wraprow select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 10px;font-size:15px;width:100%;color:inherit}
.ystats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ystat{background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.ystat .v{font-family:'Space Grotesk',system-ui,sans-serif;font-size:24px;font-weight:700}
.ystat .k{font-size:12px;color:var(--muted)}
.yline{font-size:14px;margin:0}
.fres{padding:10px;align-items:center}
.fres .tile{width:44px;height:62px;font-size:14px}
.fres .ttl .wrap{white-space:normal;overflow:visible}
.fbtns{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex-shrink:0;width:118px}
.fbtns .meta.ok{text-align:center;padding:8px 0}
.suggest{display:flex;flex-direction:column;gap:2px;margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.suggest[hidden]{display:none}
.sug{display:flex;align-items:center;gap:10px;padding:6px 8px;border:none;background:transparent;border-radius:8px;text-align:left;min-height:44px;width:100%;color:inherit}
.sug:hover,.sug:focus-visible{background:var(--chip)}
.sug .tile{width:32px;height:46px;font-size:12px;border-radius:6px}
.sug .info{display:flex;flex-direction:column;min-width:0}
.sug .info span:first-child{font-weight:600;font-size:14px}
.sug.none{min-height:40px}
.linked{font-size:12px;color:var(--accent-ink)}
.linked:empty{display:none}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;letter-spacing:.04em;padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:center;user-select:all;-webkit-user-select:all;word-break:break-all}
.sync{font-size:12px;color:var(--muted);margin:0 4px 12px}
.linkbtn{background:none;border:none;padding:0;color:var(--accent-ink);text-decoration:underline;font-size:inherit;font-weight:500;cursor:pointer}
.note a{color:var(--accent-ink)}
.empty .actions .btn{flex:1}
.sheet h2+.meta{margin-top:-4px}
</style>
</head>
<body>
<main class="wrap" id="view" aria-live="polite"></main>
<nav class="tabs" aria-label="Main">
  <div class="in">
    <button data-tab="week"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
    <button data-tab="season"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Season</button>
    <button data-tab="library"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l4 1-3 14-4-1z"/></svg>Library</button>
    <button data-tab="friends"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg>Friends</button>
  </div>
</nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ---------- Storage ---------- */
const LS_KEY = 'animeWeek.v1', CACHE_KEY = 'animeWeek.cache.v1', SET_KEY = 'animeWeek.settings.v1';
function readLS(k){ try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function writeLS(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
function blank(){ return { v:3, updatedAt:0, shows:[], library:[], watchlist:[], log:[], friends:[], share:null }; }
let state = Object.assign(blank(), readLS(LS_KEY) || {});
let settings = Object.assign({}, readLS(SET_KEY) || {});
let cache = Object.assign({ anime:{}, tv:null, movies:null, showsAt:0 }, readLS(CACHE_KEY) || {});
function save(quiet){ state.updatedAt = Date.now(); if (!writeLS(LS_KEY, state)) toast('Couldn’t save on this device. Download a backup from Settings.'); if (!quiet){ markDirty(); scheduleAlertUpdate(); schedulePublish(); } }
function saveCache(){ writeLS(CACHE_KEY, cache); }
function saveSettings(){ writeLS(SET_KEY, settings); }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

/* ---------- Constants ---------- */
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TILES = ['#7FB2FF','#F2C14E','#9BD8B4','#E7A3C8','#C9B6FF','#8FD3E8','#FFB38A'];
const TYPES = { anime:'Anime', tv:'TV', movie:'Movies' };
const TYPE_ONE = { anime:'Anime', tv:'TV show', movie:'Movie' };
const HOUR = 3600000, DAY_MS = 86400000;

/* Saved lists, used only until live data loads (or if a source is unreachable). */
const TV_FALLBACK = [
  {t:'Dexter: Resurrection Season 2', k:'Returning', p:'2026-10-30', w:'Paramount+'},
  {t:'Nocturne', k:'New', p:'2026-10-30', w:'Apple TV'},
  {t:'The Gilded Age Season 4', k:'Returning', p:'2026-11-01', w:'HBO'},
  {t:'Stick Season 2', k:'Returning', p:'2026-11-04', w:'Apple TV'},
  {t:'Black Doves Season 2', k:'Returning', p:'2026-11-05', w:'Netflix', full:1},
  {t:'The Institute Season 2', k:'Returning', p:'2026-11-08', w:'MGM+'},
  {t:'The Lord of the Rings: The Rings of Power Season 3', k:'Returning', p:'2026-11-11', w:'Prime Video'},
  {t:'Percy Jackson and the Olympians Season 3', k:'Returning', p:'2026-11-20', w:'Disney+'},
  {t:'Yellowjackets Season 4', k:'Returning', p:'2026-11-20', w:'Paramount+'},
  {t:'Blade Runner 2099', k:'New', p:'2026-11-25', w:'Prime Video', full:1},
  {t:'Harry Potter', k:'New', p:'2026-12-25', w:'HBO'},
  {t:'Ahsoka Season 2', k:'Returning', p:'2027-01-20', w:'Disney+'}
];
const MOVIES_FALLBACK = [
  {t:'Clayface', d:'2026-10-23', w:'Theaters'},
  {t:'Godzilla Minus Zero', d:'2026-11-03', w:'Theaters'},
  {t:'The Cat in the Hat', d:'2026-11-06', w:'Theaters'},
  {t:'The Hunger Games: Sunrise on the Reaping', d:'2026-11-20', w:'Theaters'},
  {t:'Violent Night 2', d:'2026-12-04', w:'Theaters'},
  {t:'Jumanji 3', d:'2026-12-11', w:'Theaters'},
  {t:'Avengers: Doomsday', d:'2026-12-18', w:'Theaters'},
  {t:'Dune: Part Three', d:'2026-12-18', w:'Theaters'},
  {t:'Werwulf', d:'2026-12-25', w:'Theaters'}
];

/* ---------- Helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function norm(s){ return String(s||'').replace(/[’‘]/g,"'").trim().toLowerCase(); }
function typeOf(x){ return x.type || 'anime'; }
function typeOptions(sel){ return Object.keys(TYPES).map(k => '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + TYPE_ONE[k] + '</option>').join(''); }
function tileColor(t){ let h=0; for (const c of String(t)) h = (h*31 + c.charCodeAt(0)) >>> 0; return TILES[h % TILES.length]; }
function initials(t){
  const w = String(t).replace(/[^A-Za-z0-9 ]/g,' ').split(/\s+/).filter(x => x && !/^(the|a|an|of|and|season|s\d+|\d+)$/i.test(x));
  return ((w[0]||t||'?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
}
function tile(title, cover, extra){
  return '<div class="tile' + (extra ? ' ' + extra : '') + '" style="background:' + tileColor(title) + '" aria-hidden="true">' +
    (cover ? '<img src="' + esc(cover) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : esc(initials(title))) + '</div>';
}
function today(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ if (!s) return null; const [y,m,d] = String(s).split('-').map(Number); if (!y) return null; return new Date(y, (m||1)-1, d||1); }
function fmtDate(d){ return MONTHS[d.getMonth()] + ' ' + d.getDate(); }
function hm(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function fmtTime(t){
  if (!t) return '';
  const [h,m] = t.split(':').map(Number);
  return (((h + 11) % 12) + 1) + ':' + String(m).padStart(2,'0') + ' ' + (h >= 12 ? 'PM' : 'AM');
}
function fmtAir(ms){
  const d = new Date(ms), dd = new Date(ms); dd.setHours(0,0,0,0);
  const diff = Math.round((dd - today()) / DAY_MS), time = fmtTime(hm(d));
  if (diff === 0) return 'today ' + time;
  if (diff === 1) return 'tomorrow ' + time;
  if (diff > 1 && diff < 7) return DAYS[d.getDay()] + ' ' + time;
  return fmtDate(d) + ', ' + time;
}
function dayFromDate(s){ const d = parseDate(s); return d ? d.getDay() : null; }
function ago(ms){
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' hr ago';
  return Math.round(h / 24) + ' days ago';
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg){
  const el = $('#toast');
  el.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
  clearTimeout(toast.t); toast.t = setTimeout(() => el.innerHTML = '', msg.length > 80 ? 7000 : 2800);
}
function whenText(ds){
  const d = parseDate(ds); if (!d) return 'Date not set';
  const days = Math.round((d - today()) / DAY_MS);
  if (days === 0) return 'Out today';
  if (days < 0) return 'Out since ' + fmtDate(d);
  if (days === 1) return 'Out tomorrow';
  if (days < 7) return 'Out ' + DAYS_FULL[d.getDay()] + ', ' + fmtDate(d);
  return fmtDate(d) + ', in ' + days + ' days';
}

/* ---------- Seasons ---------- */
const ORDER = ['WINTER','SPRING','SUMMER','FALL'];
function seasonOf(d){ return { season: ORDER[Math.floor(d.getMonth() / 3)], year: d.getFullYear() }; }
function nextSeason(o){ const i = ORDER.indexOf(o.season); return i === 3 ? { season:'WINTER', year:o.year + 1 } : { season:ORDER[i+1], year:o.year }; }
function seasonLabel(o){ return o.season[0] + o.season.slice(1).toLowerCase() + ' ' + o.year; }
function seasonStartInt(o){ return Number(o.year + ['01','04','07','10'][ORDER.indexOf(o.season)] + '01'); }
const CUR = seasonOf(new Date()), NEXT = nextSeason(CUR);

/* ---------- AniList (anime) ---------- */
async function anilistPost(url, body){
  const r = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json', 'Accept':'application/json' }, body });
  const j = await r.json().catch(() => null);
  if (j && j.data) return { data: j.data, stale: r.headers.get('X-Airday-Stale') === '1' };
  const e = new Error('AniList ' + r.status);
  e.status = r.status; e.detail = (j && j.errors && j.errors[0] && j.errors[0].message) || '';
  e.retryAfter = Number(r.headers.get('Retry-After')) || 0;
  throw e;
}
async function anilistFull(query, variables){
  const body = JSON.stringify({ query, variables: variables || {} });
  let lastErr = null;
  if (relayOn()){
    try { return await anilistPost(MOVIES_RELAY + '/anilist', body); } catch(e){ lastErr = e; }
  }
  try { return await anilistPost('https://graphql.anilist.co', body); }
  catch(e){
    if (e.status === 429){
      await sleep(Math.min((e.retryAfter || 3) * 1000, 6000));
      try { return await anilistPost('https://graphql.anilist.co', body); } catch(e2){ throw e2; }
    }
    throw (lastErr && lastErr.status === 403) ? lastErr : e;
  }
}
async function anilist(query, variables){ return (await anilistFull(query, variables)).data; }
function anilistReason(err){
  const d = String((err && err.detail) || '').toLowerCase();
  if (err && err.status === 403 && /disabled|stability|maintenance/.test(d)) return 'AniList has switched off its service for now, on their end. Airday will keep trying.';
  if (err && err.status === 429) return 'AniList is busy right now. Airday will try again in a couple of minutes.';
  if (err && err.status >= 500) return 'AniList is having problems on their end. Airday will try again in a couple of minutes.';
  if (err && err.status === 403) return 'AniList is refusing requests right now. Airday will try again in a couple of minutes.';
  return 'Couldn’t reach AniList. Check your connection and try again.';
}
const A_FIELDS = 'id title{romaji english} episodes status startDate{year month day} nextAiringEpisode{airingAt episode} coverImage{medium large} externalLinks{site} genres';
const SEQUEL_RE = /(season\s*\d|\b\d+(st|nd|rd|th)\s+season|\bpart\s*\d|\bcour\s*\d|\b(ii|iii|iv)\b|\b2nd\b|\b3rd\b)/i;
function mapAnime(m, cont){
  const t = (m.title.english || m.title.romaji || '').trim();
  const sd = m.startDate && m.startDate.year ? m.startDate.year + '-' + String(m.startDate.month||1).padStart(2,'0') + '-' + String(m.startDate.day||1).padStart(2,'0') : '';
  return { id:m.id, t, alt:m.title.romaji || '', k: cont ? 'Continuing' : (SEQUEL_RE.test(t + ' ' + (m.title.romaji||'')) ? 'Returning' : 'New'),
    eps:m.episodes || null, status:m.status, at: m.nextAiringEpisode ? m.nextAiringEpisode.airingAt * 1000 : null,
    next: m.nextAiringEpisode ? m.nextAiringEpisode.episode : null, cover: m.coverImage ? (m.coverImage.large || m.coverImage.medium) : '', thumb: m.coverImage ? m.coverImage.medium : '',
    cr: (m.externalLinks || []).some(l => /crunchyroll/i.test(l.site || '')), start: sd, genres: m.genres || [] };
}
async function fetchAnimeSeason(so, withContinuing){
  const list = 'type:ANIME,isAdult:false,format_in:[TV,TV_SHORT,ONA],sort:POPULARITY_DESC';
  const q = p => 'query($s:MediaSeason,$y:Int){Page(page:' + p + ',perPage:50){media(season:$s,seasonYear:$y,' + list + '){' + A_FIELDS + '}}}';
  const jobs = [anilist(q(1), { s:so.season, y:so.year }), anilist(q(2), { s:so.season, y:so.year })];
  if (withContinuing) jobs.push(anilist('query($d:FuzzyDateInt){Page(page:1,perPage:50){media(status:RELEASING,startDate_lesser:$d,' + list + '){' + A_FIELDS + '}}}', { d: seasonStartInt(so) }));
  const res = await Promise.all(jobs);
  const seen = new Map();
  res.forEach((d, i) => (d.Page.media || []).forEach(m => { if (!seen.has(m.id)) seen.set(m.id, mapAnime(m, i === 2)); }));

}

/* ---------- TVmaze (TV) ---------- */
async function fetchTVLineup(onProgress){
  const dates = []; for (let i = -7; i <= 21; i++){ const d = today(); d.setDate(d.getDate() + i); dates.push(ymd(d)); }
  const urls = []; dates.forEach(d => { urls.push('https://api.tvmaze.com/schedule/web?date=' + d); urls.push('https://api.tvmaze.com/schedule?country=US&date=' + d); });
  const found = new Map(), perDay = {}; let ok = 0;
  for (let i = 0; i < urls.length; i++){
    try {
      let r = await fetch(urls[i]);
      if (r.status === 429){ await sleep(6000); r = await fetch(urls[i]); }
      if (r.ok){
        ok++;
        for (const e of await r.json()){
          const show = e.show || (e._embedded && e._embedded.show);
          if (!show || e.season == null) continue;
          const dk = show.id + ':' + e.season + ':' + e.airdate; perDay[dk] = (perDay[dk] || 0) + 1;
          if (e.number !== 1) continue;
          if (show.language && show.language !== 'English') continue;
          if (!['Scripted','Animation'].includes(show.type)) continue;
          const key = show.id + ':' + e.season;
          if (found.has(key)) continue;
          found.set(key, { id: show.id, t: e.season > 1 ? show.name + ' Season ' + e.season : show.name, k: e.season > 1 ? 'Returning' : 'New', p: e.airdate,
            w: (show.webChannel && show.webChannel.name) || (show.network && show.network.name) || '', cover: show.image ? String(show.image.medium).replace('http:','https:') : '', season: e.season });
        }
      }
    } catch(err){}
    if (onProgress) onProgress(i + 1, urls.length);
    await sleep(550);
  }
  if (!ok) throw new Error('TVmaze unreachable');
  return [...found.values()].map(x => Object.assign(x, { full: (perDay[x.id + ':' + x.season + ':' + x.p] || 0) > 2 ? 1 : 0 })).sort((a,b) => a.p.localeCompare(b.p));
}
function ensureTV(force){
  const e = cache.tv;
  if (ui.busy.tv || coolingDown('tv', force) || (!force && e && Date.now() - e.at < 24 * HOUR)) return;
  ui.busy.tv = true; ui.msg.tv = '';
  (async () => {
    try { cache.tv = { at: Date.now(), items: await fetchTVLineup((n, total) => { ui.msg.tvProgress = n + ' of ' + total; if (ui.tab === 'season' && ui.sType === 'tv' && n % 6 === 0) render(); }) }; saveCache(); }
    catch(err){ ui.failAt.tv = Date.now(); ui.msg.tv = 'Couldn’t reach TVmaze. ' + (e ? 'Showing the list from ' + ago(e.at) + '.' : 'Showing a saved list for now.'); }
    finally { ui.busy.tv = false; ui.msg.tvProgress = ''; if (ui.tab === 'season') render(); }
  })();
}
async function tvShowData(s){
  const name = s.title.replace(/\s+season\s+\d+\s*$/i, '').trim();
  const url = s.tvmazeId ? 'https://api.tvmaze.com/shows/' + s.tvmazeId + '?embed=episodes' : 'https://api.tvmaze.com/singlesearch/shows?q=' + encodeURIComponent(name) + '&embed=episodes';
  const r = await fetch(url);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('TVmaze ' + r.status);
  return r.json();
}
function applyTV(s, show){
  s.tvmazeId = show.id; s.linkTitle = show.name; s.genres = show.genres || [];
  if (!s.cover && show.image) s.cover = String(show.image.medium).replace('http:','https:');
  const eps = ((show._embedded && show._embedded.episodes) || []).filter(e => e.number != null);
  const m = s.title.match(/season\s+(\d+)\s*$/i);
  const season = m ? Number(m[1]) : Math.max(0, ...eps.map(e => e.season));
  const inSeason = eps.filter(e => e.season === season), now = Date.now();
  const next = inSeason.find(e => e.airstamp && Date.parse(e.airstamp) > now);
  applyLive(s, { total: inSeason.length || null, aired: inSeason.filter(e => e.airstamp && Date.parse(e.airstamp) <= now).length,
    at: next ? Date.parse(next.airstamp) : null, status: next ? 'RELEASING' : (inSeason.length ? 'FINISHED' : 'NOT_YET_RELEASED') });
}

/* ---------- Live episode info for your shows ---------- */
function applyLive(s, live){
  s.live = live;
  if ((s.epOffset == null || s.epOffset === '') && live.aired != null){
    const ep = Number(s.ep) || 0;
    s.epOffset = ep > live.aired + 1 ? ep - live.aired : 0;
  }
}
function searchTitle(t){ return String(t).replace(/[’‘]/g, "'").replace(/<3/g, '').trim(); }
async function refreshShows(force){
  if (ui.busy.shows) return;
  const pending = state.shows.some(x => !x.noLink && !x.live);
  if (!force && !pending && Date.now() - (cache.showsAt || 0) < 30 * 60000) return;
  ui.busy.shows = true; ui.msg.shows = '';
  let failed = false;
  try {
    const anime = state.shows.filter(s => typeOf(s) === 'anime' && !s.noLink);
    const unlinked = anime.filter(s => !s.anilistId);
    if (unlinked.length){
      const q = 'query{' + unlinked.map((s, i) => {
        const t = JSON.stringify(searchTitle(s.title));
        return 'r' + i + ':Media(search:' + t + ',type:ANIME,status:RELEASING){id title{english romaji}} a' + i + ':Media(search:' + t + ',type:ANIME,sort:SEARCH_MATCH){id title{english romaji}}';
      }).join(' ') + '}';
      const d = await anilist(q);
      unlinked.forEach((s, i) => {
        const m = d['r' + i] || d['a' + i];
        if (m){ s.anilistId = m.id; s.linkTitle = m.title.english || m.title.romaji; } else s.noLink = true;
      });
    }
    const ids = anime.filter(s => s.anilistId).map(s => s.anilistId);
    if (ids.length){
      const d = await anilist('query($ids:[Int]){Page(perPage:50){media(id_in:$ids){id episodes status nextAiringEpisode{airingAt episode} coverImage{medium} title{english romaji} genres}}}', { ids });
      const byId = {}; (d.Page.media || []).forEach(m => byId[m.id] = m);
      anime.forEach(s => {
        const m = byId[s.anilistId]; if (!m) return;
        const n = m.nextAiringEpisode;
        applyLive(s, { total: m.episodes || null, aired: n ? n.episode - 1 : (m.status === 'FINISHED' ? m.episodes : (m.status === 'NOT_YET_RELEASED' ? 0 : null)), at: n ? n.airingAt * 1000 : null, status: m.status });
        if (!s.cover && m.coverImage) s.cover = m.coverImage.medium;
        if (m.genres) s.genres = m.genres;
        if (!s.linkTitle) s.linkTitle = m.title.english || m.title.romaji;
      });
    }
  } catch(err){ failed = true; }
  for (const s of state.shows.filter(x => typeOf(x) === 'tv' && !x.noLink)){
    try { const show = await tvShowData(s); if (show) applyTV(s, show); else s.noLink = true; }
    catch(err){ failed = true; }
  }
  if (failed) ui.msg.shows = 'Couldn’t update some episode info. It will try again next time you open the app.';
  else { cache.showsAt = Date.now(); saveCache(); }
  save(true);
  ui.busy.shows = false;
  render();
  scheduleAlertUpdate(); schedulePublish();
}

/* ---------- Airing math ---------- */
function showInfo(s){
  const ep = Number(s.ep) || 0, L = s.live, off = Number(s.epOffset) || 0;
  const total = L && L.total ? L.total + off : (Number(s.total) || 0);
  let aired = null, endText = '', airText = '';
  if (L){
    if (L.aired != null) aired = L.aired + off;
    if (L.at) airText = 'Airs ' + fmtAir(L.at);
    if (L.status === 'FINISHED') endText = 'Finished airing';
    else if (L.total && L.at && L.aired != null){
      const remaining = L.total - (L.aired + 1);
      endText = remaining <= 0 ? 'Finale is next' : 'Ends ' + fmtDate(new Date(L.at + remaining * 7 * DAY_MS));
    } else if (!L.total) endText = 'Episode count not announced';
  } else {
    const prem = parseDate(s.premiere), t = today();
    if (prem){
      const diff = Math.floor((t - prem) / DAY_MS);
      aired = diff < 0 ? 0 : Math.floor(diff / 7) + 1;
      if (total) aired = Math.min(aired, total);
    }
    if (total && prem){
      const end = new Date(prem); end.setDate(end.getDate() + (Number(s.total) - 1) * 7);
      const days = Math.round((end - t) / DAY_MS);
      endText = days < 0 ? 'Finished airing' : days < 7 ? 'Finale airs ' + (days === 0 ? 'today' : DAYS_FULL[end.getDay()]) : 'Ends ' + fmtDate(end);
    } else if (!total) endText = 'Add the episode count to see when it ends';
  }
  const ended = L ? L.status === 'FINISHED' : endText === 'Finished airing';
  return { total, ep, aired, ended, left: total ? Math.max(total - ep, 0) : null, endText, airText,
    behind: aired != null ? Math.max(aired - ep, 0) : 0, pct: total ? Math.min(100, Math.round(ep / total * 100)) : 0, finished: total > 0 && ep >= total };
}
function sortTime(s){ return s.time || (s.live && s.live.at ? hm(new Date(s.live.at)) : '99'); }


/* ---------- Library posters and details ---------- */
function libSearchTitle(t){
  const s = searchTitle(t);
  const parts = s.split(/\s+\/\s+/);
  return (parts.length > 1 ? parts[parts.length - 1] : s).replace(/[<>~]/g, ' ').trim();
}
let enriching = false;
async function enrichLibrary(){
  if (enriching) return;
  enriching = true;
  let changed = 0;
  const done = () => { save(true); if (ui.tab === 'library') render(); };
  try {
    // Anime: AniList, 10 titles per request
    const anime = state.library.filter(x => typeOf(x) === 'anime' && !x.coverChecked);
    for (let i = 0; i < anime.length; i += 10){
      const batch = anime.slice(i, i + 10);
      const q = 'query{' + batch.map((x, n) => 'm' + n + ':Media(search:' + JSON.stringify(libSearchTitle(x.title)) + ',type:ANIME,sort:SEARCH_MATCH){id episodes startDate{year} coverImage{medium} genres}').join(' ') + '}';
      let d;
      try { d = await anilist(q); } catch(err){ break; }
      batch.forEach((x, n) => {
        const m = d['m' + n];
        if (m){ x.anilistId = m.id; x.genres = m.genres || []; if (m.coverImage) x.cover = m.coverImage.medium; if (!x.season && m.startDate && m.startDate.year) x.season = String(m.startDate.year); }
        x.coverChecked = true; changed++;
      });
      done();
      await sleep(2500);
    }
    // TV: TVmaze
    for (const x of state.library.filter(y => typeOf(y) === 'tv' && !y.coverChecked)){
      try {
        const r = await fetch('https://api.tvmaze.com/singlesearch/shows?q=' + encodeURIComponent(libSearchTitle(x.title)));
        if (r.ok){ const sh = await r.json(); if (sh.image) x.cover = String(sh.image.medium).replace('http:','https:'); if (!x.season && sh.premiered) x.season = sh.premiered.slice(0,4); x.tvmazeId = sh.id; x.genres = sh.genres || []; }
        if (r.ok || r.status === 404){ x.coverChecked = true; changed++; }
      } catch(err){ break; }
      await sleep(600);
    }
    if (changed) done();
    // Movies: TMDB through the relay
    if (relayOn()){
      for (const x of state.library.filter(y => typeOf(y) === 'movie' && !y.coverChecked)){
        try {
          const t = libSearchTitle(x.title), yr = (t.match(/\b(19|20)\d{2}$/) || [''])[0];
          const r = await fetch(MOVIES_RELAY + '/search?q=' + encodeURIComponent(yr ? t.replace(yr, '').trim() : t) + (yr ? '&year=' + yr : ''));
          if (!r.ok) break;
          const m = (await r.json()).result;
          if (m){ if (m.poster) x.cover = 'https://image.tmdb.org/t/p/w185' + m.poster; if (!x.season && m.date) x.season = m.date.slice(0,4); x.tmdbId = m.id; }
          x.coverChecked = true; changed++;
        } catch(err){ break; }
        await sleep(200);
      }
      done();
    }
  } finally { enriching = false; }
}

async function syncFetch(method, path, body){
  const r = await fetch(MOVIES_RELAY + path, { method, cache:'no-store', headers: body ? { 'Content-Type':'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  let j = null; try { j = await r.json(); } catch(e){}
  return { status: r.status, j };
}
function adopt(data, updatedAt){
  state = Object.assign(blank(), JSON.parse(data));
  writeLS(LS_KEY, state);
  settings.sync.base = updatedAt; settings.sync.dirty = false; settings.sync.at = Date.now(); saveSettings();
  render();
}
function syncGone(){ settings.sync = null; saveSettings(); toast('That sync code no longer exists. Sync is off on this device.'); }
async function pushSync(){
  if (!syncOn() || syncBusy) return;
  syncBusy = true;
  try {
    const code = encodeURIComponent(settings.sync.code);
    const { status, j } = await syncFetch('PUT', '/sync/' + code, { data: JSON.stringify(state), base: settings.sync.base || 0 });
    if (status === 200){ settings.sync.base = j.updatedAt; settings.sync.dirty = false; settings.sync.at = Date.now(); saveSettings(); }
    else if (status === 409){
      const g = await syncFetch('GET', '/sync/' + code);
      if (g.status === 200){ adopt(g.j.data, g.j.updatedAt); toast('Your other device had newer changes, so Airday loaded those. Redo your last change if it’s missing.'); }
    }
    else if (status === 404) syncGone();
  } catch(e){ /* offline: stays marked, tries again later */ }
  finally { syncBusy = false; }
}
async function pullSync(){
  if (!syncOn() || syncBusy) return;
  if (settings.sync.dirty) return pushSync();
  syncBusy = true;
  try {
    const { status, j } = await syncFetch('GET', '/sync/' + encodeURIComponent(settings.sync.code));
    if (status === 200){
      if (settings.sync.dirty){ /* a change happened while loading: let the push sort it out */ }
      else if (j.updatedAt > (settings.sync.base || 0)) adopt(j.data, j.updatedAt);
      else { settings.sync.at = Date.now(); saveSettings(); }
    } else if (status === 404) syncGone();
  } catch(e){}
  finally { syncBusy = false; }
  if (settings.sync && settings.sync.dirty) pushSync();
}
function normCode(v){
  let s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (s.startsWith('AIRDAY')) s = s.slice(6);
  return s.length === 12 ? 'AIRDAY-' + s.slice(0,4) + '-' + s.slice(4,8) + '-' + s.slice(8) : '';
}
function syncSection(){
  if (!relayOn()) return '';
  if (syncOn()){
    return '<h2 style="margin-top:4px">Sync across devices</h2>' +
      '<p class="meta" style="margin:0">On. Enter this code on your other phone or computer. Keep it private: anyone with it can see and change your lists.</p>' +
      '<div class="codebox">' + esc(settings.sync.code) + '</div>' +
      (settings.sync.at ? '<p class="meta" style="margin:0">Last synced ' + ago(settings.sync.at) + '.</p>' : '') +
      '<div class="actions"><button class="btn ghost" id="s-copy">Copy code</button><button class="btn ghost" id="s-syncnow">Sync now</button></div>' +
      '<div class="actions"><button class="btn danger" id="s-syncoff">Turn off sync on this device</button></div>';
  }
  return '<h2 style="margin-top:4px">Sync across devices</h2>' +
    '<p class="meta" style="margin:0">Keep your phone and computer in step. Turn it on here, then enter the code on your other device.</p>' +
    '<div class="actions"><button class="btn" id="s-syncon">Turn on sync</button></div>' +
    '<div class="field"><label for="s-codein">Already have a code?</label><input id="s-codein" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AIRDAY-XXXX-XXXX-XXXX"></div>' +
    '<div class="actions"><button class="btn ghost" id="s-connect">Connect this device</button></div>';
}
function bindSync(sheet){
  const on = $('#s-syncon', sheet);
  if (on) on.addEventListener('click', async () => {
    on.disabled = true; on.textContent = 'Turning on…';
    try {
      const { status, j } = await syncFetch('POST', '/sync', { data: JSON.stringify(state) });
      if (status !== 200 || !j || !j.code) throw new Error('sync');
      settings.sync = { code: j.code, base: j.updatedAt, at: Date.now(), dirty: false }; saveSettings();
      settingsSheet(); toast('Sync is on. Enter this code on your other device.');
    } catch(e){ on.disabled = false; on.textContent = 'Turn on sync'; toast('Couldn’t turn on sync. Check your connection and try again.'); }
  });
  const con = $('#s-connect', sheet);
  if (con) con.addEventListener('click', async () => {
    const code = normCode($('#s-codein', sheet).value);
    if (!code){ toast('That doesn’t look like a sync code. It looks like AIRDAY-XXXX-XXXX-XXXX.'); return; }
    con.disabled = true; con.textContent = 'Connecting…';
    try {
      const { status, j } = await syncFetch('GET', '/sync/' + encodeURIComponent(code));
      if (status === 404){ toast('No synced lists found for that code.'); return; }
      if (status !== 200) throw new Error('sync');
      const incoming = JSON.parse(j.data), n = (incoming.shows||[]).length, m = (incoming.library||[]).length;
      if ((state.shows.length || state.library.length) && !confirm('Replace what’s on this device with your synced lists (' + n + ' shows, ' + m + ' library titles)?')) return;
      settings.sync = { code, base: 0 }; adopt(j.data, j.updatedAt);
      closeSheet(); toast('Connected. This device now stays in sync.'); cache.showsAt = 0; refreshShows(true); setTimeout(enrichLibrary, 3000);
    } catch(e){ toast('Couldn’t connect. Check your connection and try again.'); }
    finally { con.disabled = false; con.textContent = 'Connect this device'; }
  });
  const cp = $('#s-copy', sheet);
  if (cp) cp.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(settings.sync.code); toast('Code copied'); } catch(e){ toast('Press and hold the code to copy it.'); }
  });
  const now = $('#s-syncnow', sheet);
  if (now) now.addEventListener('click', async () => {
    now.disabled = true; now.textContent = 'Syncing…';
    if (settings.sync.dirty) await pushSync(); else await pullSync();
    settingsSheet(); toast('Synced');
  });
  const off = $('#s-syncoff', sheet);
  if (off) off.addEventListener('click', () => {
    if (!confirm('Turn off sync on this device? Your lists stay here, they just stop updating from your other devices.')) return;
    settings.sync = null; saveSettings(); settingsSheet(); toast('Sync is off on this device.');
  });
}

function logEvent(k, title, extra){
  if (!Array.isArray(state.log)) state.log = [];
  const now = new Date();
  state.log.push(Object.assign({ d: ymd(now), w: now.getDay(), k, t: title }, extra || {}));
  if (state.log.length > 6000) state.log = state.log.slice(-6000);
}

/* ---------- New since you last checked ---------- */
function newEps(s, i){
  i = i || showInfo(s);
  if (i.aired == null || s.seen == null) return 0;
  return Math.max(0, i.aired - Math.max(Number(s.seen) || 0, i.ep));
}
function markSeen(){
  let changed = false;
  state.shows.forEach(s => { const i = showInfo(s); if (i.aired != null && s.seen !== i.aired){ s.seen = i.aired; changed = true; } });
  if (changed) save(true);
}

/* ---------- Season wrap-up ---------- */
function endedShows(){ return state.shows.filter(s => !s.backlog && showInfo(s).ended); }
function endedKey(){ return endedShows().map(s => s.id).sort().join(','); }
function moveToLibrary(s, status){
  const i = showInfo(s), typ = typeOf(s);
  const existing = state.library.find(x => typeOf(x) === typ && norm(x.title) === norm(s.title));
  const entry = { season: seasonLabel(CUR), eps: i.total || s.ep || null, fav: !!s.fav, status, doneAt: Date.now(),
    genres: (s.genres && s.genres.length) ? s.genres : ((existing && existing.genres) || []) };
  if (s.cover){ entry.cover = s.cover; entry.coverChecked = true; }
  let target;
  if (existing){ Object.assign(existing, entry); target = existing; }
  else { target = Object.assign({ id: uid(), type: typ, title: s.title }, entry); state.library.push(target); }
  state.shows = state.shows.filter(x => x.id !== s.id);
  logEvent('done', s.title, { ty: typ, st: status });
  return target;
}
function wrapSheet(){
  const list = endedShows();
  if (!list.length){ toast('Nothing on your week has finished airing yet.'); return; }
  openSheet(
    '<h2>Season wrap-up</h2><p class="meta" style="margin:0">These shows have finished airing. Choose what happens to each one.</p>' +
    list.map(s => {
      const i = showInfo(s), caught = i.total && i.ep >= i.total;
      return '<div class="wraprow">' + tile(s.title, s.cover) + '<div class="info"><span class="name">' + esc(s.title) + '</span>' +
        '<span class="meta">' + esc(caught ? 'All ' + i.total + ' watched' : 'Watched ' + i.ep + (i.total ? ' of ' + i.total : '')) + '</span>' +
        '<label class="vh" for="w-' + s.id + '">What to do with ' + esc(s.title) + '</label>' +
        '<select id="w-' + s.id + '" data-wrap="' + s.id + '"><option value="completed"' + (caught ? ' selected' : '') + '>Move to library as completed</option>' +
        '<option value="dropped">Move to library as dropped</option><option value="keep"' + (caught ? '' : ' selected') + '>Keep on my week</option></select></div></div>';
    }).join('') +
    '<div class="actions"><button class="btn ghost" data-close="1">Cancel</button><button class="btn" id="w-go">Wrap up</button></div>',
    sheet => {
      $('#w-go', sheet).addEventListener('click', () => {
        let moved = 0;
        sheet.querySelectorAll('[data-wrap]').forEach(sel => {
          if (sel.value === 'keep') return;
          const s = state.shows.find(x => x.id === sel.dataset.wrap);
          if (s){ moveToLibrary(s, sel.value); moved++; }
        });
        settings.wrapSeen = endedKey(); saveSettings();
        save(); closeSheet(); render();
        toast(moved ? moved + ' show' + (moved === 1 ? '' : 's') + ' moved to your library. Rate them there whenever you like.' : 'Nothing moved.');
      });
    }
  );
}

/* ---------- Year in review ---------- */
const EP_MIN = { anime: 24, tv: 45 };
function yearSheet(year){
  const log = Array.isArray(state.log) ? state.log : [];
  const cur = String(new Date().getFullYear());
  const years = [...new Set([cur, ...log.map(e => e.d.slice(0, 4))])].sort().reverse();
  year = String(year || cur);
  const L = log.filter(e => e.d.startsWith(year));
  const eps = L.filter(e => e.k === 'ep'), done = L.filter(e => e.k === 'done' && e.st !== 'dropped'), movies = L.filter(e => e.k === 'movie');
  const minutes = eps.reduce((a, e) => a + (EP_MIN[e.ty] || 24), 0) + movies.length * 120;
  const hours = Math.round(minutes / 60), hoursText = minutes && minutes < 60 ? 'Under 1' : '~' + hours;
  const byShow = {}; eps.forEach(e => byShow[e.t] = (byShow[e.t] || 0) + 1);
  const topShow = Object.entries(byShow).sort((a, b) => b[1] - a[1])[0];
  const days = [0,0,0,0,0,0,0]; eps.forEach(e => days[e.w]++);
  const busiest = eps.length ? DAYS_FULL[days.indexOf(Math.max(...days))] : '';
  const gmap = {}; [...state.library, ...state.shows].forEach(x => { if (x.genres && x.genres.length) gmap[norm(x.title)] = x.genres; });
  const gcount = {}; [...eps, ...done].forEach(e => (gmap[norm(e.t)] || []).forEach(g => gcount[g] = (gcount[g] || 0) + 1));
  const topGenres = Object.entries(gcount).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]);
  const best = state.library.filter(x => x.doneAt && String(new Date(x.doneAt).getFullYear()) === year && Number(x.rating) >= 4).sort((a, b) => b.rating - a.rating).slice(0, 3);
  const first = log.length ? parseDate(log[0].d) : null;
  const stat = (v, k) => '<div class="ystat"><span class="v">' + esc(v) + '</span><span class="k">' + esc(k) + '</span></div>';
  let h = '<h2>Your ' + esc(year) + ' in Airday</h2>';
  if (years.length > 1) h += '<div class="chips" style="margin:0">' + years.map(y => '<button class="chipb' + (y === year ? ' on' : '') + '" aria-pressed="' + (y === year) + '" data-year="' + y + '">' + y + '</button>').join('') + '</div>';
  if (!L.length){
    h += '<div class="empty">Nothing logged for ' + esc(year) + ' yet. Every +1, finished show and movie you mark as seen counts toward this.</div>';
  } else {
    h += '<div class="ystats">' + stat(eps.length, 'Episodes watched') + stat(hoursText, 'Hours') + stat(done.length, 'Shows finished') + stat(movies.length, 'Movies seen') + '</div>';
    if (topShow) h += '<p class="yline"><b>Most watched:</b> ' + esc(topShow[0]) + ' (' + topShow[1] + ' episode' + (topShow[1] === 1 ? '' : 's') + ')</p>';
    if (topGenres.length) h += '<p class="yline"><b>Top genres:</b> ' + esc(topGenres.join(', ')) + '</p>';
    if (busiest) h += '<p class="yline"><b>Busiest day:</b> ' + busiest + 's</p>';
    if (best.length) h += '<p class="yline"><b>Highest rated:</b> ' + best.map(x => esc(x.title) + ' <span class="stars">' + stars(x.rating) + '</span>').join(', ') + '</p>';
  }
  if (first) h += '<p class="meta" style="margin:0">Counting from ' + fmtDate(first) + ', ' + first.getFullYear() + ', when you started tracking in Airday.</p>';
  h += '<div class="actions">' + (L.length ? '<button class="btn" id="y-share">Share</button>' : '') + '<button class="btn ghost" data-close="1">Close</button></div>';
  const text = 'My ' + year + ' in Airday: ' + eps.length + ' episodes, ' + done.length + ' shows finished, ' + movies.length + ' movies, ' + (hours ? 'about ' + hours + ' hours' : 'under an hour') + '.' +
    (topShow ? ' Most watched: ' + topShow[0] + '.' : '') + (topGenres.length ? ' Top genres: ' + topGenres.join(', ') + '.' : '') + ' ' + SITE;
  openSheet(h, sheet => {
    const b = $('#y-share', sheet);
    if (b) b.addEventListener('click', () => shareText(text, 'Copied. Paste it anywhere to share.'));
  });
}
async function shareText(text, copied, url){
  try {
    if (navigator.share){ await navigator.share(url ? { title:'Airday', text, url } : { title:'Airday', text }); return; }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url ? text + ' ' + url : text); toast(copied); } catch(e){ toast('Couldn’t copy. Press and hold to copy it instead.'); }
}

/* ---------- Episode alerts ---------- */
function alertsSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function b64urlToBytes(v){ const s = v.replace(/-/g, '+').replace(/_/g, '/'); const bin = atob(s + '='.repeat((4 - s.length % 4) % 4)); return Uint8Array.from(bin, c => c.charCodeAt(0)); }
function alertShows(){
  return state.shows.slice(0, 150).map(s => {
    const off = Number(s.epOffset) || 0;
    return { a: s.anilistId || 0, t: s.title, o: off, v: (!s.anilistId && s.live && s.live.at) ? s.live.at : 0, n: (s.live && s.live.aired != null) ? s.live.aired + 1 + off : 0 };
  });
}
var alertTimer = null;
function scheduleAlertUpdate(){ if (!settings.alerts || !relayOn()) return; clearTimeout(alertTimer); alertTimer = setTimeout(sendAlertShows, 5000); }
async function currentSub(){
  if (!alertsSupported()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? reg.pushManager.getSubscription() : null;
}
async function sendAlertShows(){
  try {
    const sub = await currentSub();
    if (!sub){ settings.alerts = false; saveSettings(); return; }
    const shows = alertShows(), hash = JSON.stringify(shows);
    if (hash === settings.alertsHash) return;
    const r = await syncFetch('POST', '/push/subscribe', { sub: sub.toJSON(), shows });
    if (r.status === 200){ settings.alertsHash = hash; saveSettings(); }
  } catch(e){}
}
function withTimeout(p, ms, code){ return Promise.race([p, new Promise((_, reject) => setTimeout(() => reject(new Error(code)), ms))]); }
async function swReady(){
  let reg = await navigator.serviceWorker.getRegistration();
  if (!reg){
    try { reg = await navigator.serviceWorker.register('sw.js'); } catch(e){ throw new Error('sw'); }
  }
  if (reg.active) return reg;
  return withTimeout(navigator.serviceWorker.ready, 10000, 'sw');
}
async function turnOnAlerts(){
  if (!alertsSupported()) throw new Error('unsupported');
  const perm = await withTimeout(Notification.requestPermission(), 60000, 'perm');
  if (perm !== 'granted') throw new Error('denied');
  const k = await withTimeout(syncFetch('GET', '/push/key'), 12000, 'key').catch(() => { throw new Error('key'); });
  if (k.status !== 200 || !k.j || !k.j.key) throw new Error('key');
  const reg = await swReady();
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await withTimeout(reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(k.j.key) }), 15000, 'subscribe');
  const shows = alertShows();
  const r = await withTimeout(syncFetch('POST', '/push/subscribe', { sub: sub.toJSON(), shows }), 12000, 'save').catch(() => { throw new Error('save'); });
  if (r.status !== 200) throw new Error('save');
  settings.alerts = true; settings.alertsHash = JSON.stringify(shows); saveSettings();
}
const ALERT_ERRORS = {
  denied: 'Notifications are blocked. Allow them for Airday in your phone or browser settings, then try again.',
  perm: 'The notification prompt didn’t get an answer. Try again and tap Allow.',
  sw: 'Airday couldn’t finish setting up its background file (sw.js). Check that sw.js is uploaded next to index.html, then close and reopen Airday.',
  key: 'The relay didn’t answer. Make sure the newest airday-worker.js is deployed in Cloudflare.',
  subscribe: 'Your browser didn’t finish setting up notifications. Close and reopen Airday, then try again.',
  save: 'The relay couldn’t save your alert settings. Try again in a moment.',
  unsupported: 'This browser can’t show alerts.'
};
async function turnOffAlerts(){
  try { const sub = await currentSub(); if (sub){ await syncFetch('POST', '/push/unsubscribe', { endpoint: sub.endpoint }); await sub.unsubscribe(); } } catch(e){}
  settings.alerts = false; settings.alertsHash = ''; saveSettings();
}
function alertsSection(){
  if (!relayOn()) return '';
  let body;
  if (!alertsSupported()) body = '<p class="meta" style="margin:0">This browser can’t show alerts. On iPhone, add Airday to your home screen and open it from there first.</p>';
  else if (settings.alerts) body = '<p class="meta" style="margin:0">On for this device. You’ll get a notification when a new episode of a show on your week comes out.</p>' +
    '<div class="actions"><button class="btn ghost" id="a-test">Send a test</button><button class="btn danger" id="a-off">Turn off</button></div>';
  else body = '<p class="meta" style="margin:0">Get a notification on this device when a new episode of a show on your week comes out.</p><div class="actions"><button class="btn" id="a-on">Turn on alerts</button></div>';
  return '<h2 style="margin-top:4px">Episode alerts</h2>' + body;
}
function bindAlerts(sheet){
  const on = $('#a-on', sheet);
  if (on) on.addEventListener('click', async () => {
    on.disabled = true; on.textContent = 'Turning on…';
    try { await turnOnAlerts(); settingsSheet(); toast('Alerts are on for this device.'); }
    catch(e){ on.disabled = false; on.textContent = 'Turn on alerts'; toast(ALERT_ERRORS[e.message] || 'Couldn’t turn on alerts. Try again in a moment.'); }
  });
  const off = $('#a-off', sheet);

  const test = $('#a-test', sheet);

    try { const sub = await currentSub(); const r = await syncFetch('POST', '/push/test', { endpoint: sub ? sub.endpoint : '' }); toast(r.status === 200 ? 'Test sent. It should arrive in a few seconds.' : 'Couldn’t send a test. Try turning alerts off and on again.'); }
    catch(e){ toast('Couldn’t send a test.'); }
  });
}

var pubTimer = null;
function schedulePublish(){ if (!state.share || !relayOn()) return; clearTimeout(pubTimer); pubTimer = setTimeout(publishShare, 8000); }
async function publishShare(){
  if (!state.share) return;
  const data = JSON.stringify(shareData());
  if (data === ui.lastPub) return;
  try { const r = await syncFetch('PUT', '/share/' + state.share.id, { token: state.share.token, name: state.share.name, data }); if (r.status === 200) ui.lastPub = data; } catch(e){}
}
function parseFriendId(v){
  const s = String(v || '').trim();
  const m = s.match(/[#&?]f=([A-Za-z0-9]{8})\b/) || s.match(/^([A-Za-z0-9]{8})$/);
  return m ? m[1].toUpperCase() : '';
}
async function loadFriend(id, force){
  const f = ui.friendData[id];
  if (f && f.loading) return;
  if (!force && f && Date.now() - f.at < 10 * 60000) return;
  ui.friendData[id] = Object.assign({}, f, { loading: true, at: (f && f.at) || 0 });
  try {
    const r = await syncFetch('GET', '/share/' + id);
    if (r.status === 200) ui.friendData[id] = { at: Date.now(), name: r.j.name, data: JSON.parse(r.j.data || '{}'), updatedAt: r.j.updatedAt };
    else ui.friendData[id] = { at: Date.now(), gone: r.status === 404, err: true };
  } catch(e){ ui.friendData[id] = Object.assign({}, f, { loading: false, err: true, at: Date.now() }); }
  if (ui.tab === 'friends') render();
}

      '<div class="field"><label for="sh-name">Your name, as friends will see it</label><input id="sh-name" maxlength="30" placeholder="e.g. Nick" autocomplete="nickname"></div>' +

    '<div class="actions"><button class="btn ghost" data-act="friend-add">Add friend</button></div></div>';
  const friends = state.friends || [];

  friends.forEach(fr => {
    loadFriend(fr.id);
    const fd = ui.friendData[fr.id] || {}, name = fd.name || fr.name;
    h += '<div class="friend"><div class="fhead"><div><h2>' + esc(name) + '</h2><span class="meta">' +
      (fd.gone ? 'Stopped sharing' : fd.updatedAt ? 'Updated ' + ago(fd.updatedAt) : fd.err ? 'Couldn’t load right now' : 'Loading…') + '</span></div>' +
      '<button class="linkbtn" data-frdel="' + fr.id + '">Remove</button></div>';
    if (fd.data){
      const shows = fd.data.shows || [];
      h += shows.length ? '<div class="frlist">' + shows.map((x, n) => {
        const mine = state.shows.some(s => (x.a && s.anilistId === x.a) || (x.m && s.tvmazeId === x.m) || norm(s.title) === norm(x.t));
        const meta = (x.d >= 0 ? DAYS_FULL[x.d] + 's, ' : '') + (x.n ? 'on ep ' + x.n + (x.tot ? ' of ' + x.tot : '') : 'all caught up');
        return '<div class="card">' + tile(x.t, x.c) + '<div class="cardmain"><span class="ttl"><span>' + esc(x.t) + '</span>' + (x.f ? '<span class="tag fav">FAVORITE</span>' : '') + '</span>' +
          '<span class="meta">' + esc(meta) + '</span></div>' +
          (mine ? '<span class="meta" style="padding:0 6px;text-align:right">On your week</span>' : '<button class="btn ghost small" data-fradd="' + fr.id + ':' + n + '" aria-label="Add ' + esc(x.t) + ' to my week">Add</button>') + '</div>';
      }).join('') + '</div>' : '<p class="meta" style="margin:0">Nothing on their week right now.</p>';
      const mv = fd.data.movies || [];
      if (mv.length) h += '<p class="meta" style="margin:10px 2px 0">Movies on their list: ' + esc(mv.map(m => m.t).join(', ')) + '</p>';
    }
    h += '</div>';
  });
  return h;

async function handleInvite(){
  const id = parseFriendId(location.hash);
  if (!id) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  if (!relayOn() || (state.share && state.share.id === id)) return;
  if ((state.friends || []).some(f => f.id === id)){ ui.tab = 'friends'; render(); return; }
  try {
    const r = await syncFetch('GET', '/share/' + id);
    if (r.status !== 200){ toast('That share link isn’t active anymore.'); return; }
    if (!confirm('Add ' + r.j.name + ' as a friend on Airday? You’ll see what they’re watching.')) return;
    state.friends = state.friends || []; state.friends.push({ id, name: r.j.name }); save();
    ui.tab = 'friends'; render(); toast('Added ' + r.j.name);
  } catch(e){ toast('Couldn’t open that share link. Check your connection.'); }
}
async function friendAction(act){
  if (act === 'share-start'){
    const name = ($('#sh-name') || {}).value ? $('#sh-name').value.trim() : '';
    if (!name){ toast('Add your name first.'); const el = $('#sh-name'); if (el) el.focus(); return; }
    const data = JSON.stringify(shareData());
    const r = await syncFetch('POST', '/share', { name, data }).catch(() => ({ status: 0 }));
    if (r.status !== 200 || !r.j || !r.j.id){ toast('Couldn’t start sharing. Try again in a moment.'); return; }
    state.share = { id: r.j.id, token: r.j.token, name }; ui.lastPub = data; save(); render();
    shareText(name + ' is sharing what they watch on Airday:', 'Link copied. Send it to your friends.', SITE + '#f=' + r.j.id);
  }
  if (act === 'share-link' && state.share) shareText(state.share.name + ' is sharing what they watch on Airday:', 'Link copied. Send it to your friends.', SITE + '#f=' + state.share.id);
  if (act === 'share-stop' && state.share){
    if (!confirm('Stop sharing? Friends who have your link will no longer see your list.')) return;
    await syncFetch('POST', '/share/' + state.share.id + '/delete', { token: state.share.token }).catch(() => {});
    state.share = null; ui.lastPub = ''; save(); render(); toast('Sharing stopped.');
  }
  if (act === 'friend-add'){
    const el = $('#fr-in'), id = parseFriendId(el ? el.value : '');
    if (!id){ toast('Paste the link your friend sent, or their 8-character code.'); return; }
    if (state.share && state.share.id === id){ toast('That’s your own link.'); return; }
    if ((state.friends || []).some(f => f.id === id)){ toast('They’re already on your list.'); return; }
    const r = await syncFetch('GET', '/share/' + id).catch(() => ({ status: 0 }));
    if (r.status === 404){ toast('No one is sharing with that link.'); return; }
    if (r.status !== 200){ toast('Couldn’t check that link. Try again in a moment.'); return; }
    state.friends = state.friends || []; state.friends.push({ id, name: r.j.name });
    ui.friendData[id] = { at: Date.now(), name: r.j.name, data: JSON.parse(r.j.data || '{}'), updatedAt: r.j.updatedAt };
    save(); render(); toast('Added ' + r.j.name);
  }
}

/* ---------- Find any title (old or new) ---------- */
const finder = { type: 'anime', ctx: 'library', q: '', results: [], token: 0, timer: null };
async function findTitles(type, q){
  if (type === 'anime'){
    const d = await anilist('query($q:String){Page(perPage:15){media(search:$q,type:ANIME,isAdult:false,sort:SEARCH_MATCH){id title{english romaji} episodes status format startDate{year} coverImage{medium} genres nextAiringEpisode{airingAt episode}}}}', { q });
    return (d.Page.media || []).map(m => ({ type:'anime', id:m.id, t:(m.title.english || m.title.romaji || '').trim(), year: m.startDate && m.startDate.year ? String(m.startDate.year) : '',
      eps:m.episodes || null, status:m.status, fmt:m.format, cover: m.coverImage ? m.coverImage.medium : '', genres:m.genres || [], next:m.nextAiringEpisode }));
  }
  if (type === 'tv'){
    const r = await fetch('https://api.tvmaze.com/search/shows?q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('tv');
    return (await r.json()).slice(0, 15).map(x => { const s = x.show; return { type:'tv', id:s.id, t:s.name, year: s.premiered ? s.premiered.slice(0,4) : '',
      where: (s.webChannel && s.webChannel.name) || (s.network && s.network.name) || '', status: s.status === 'Ended' ? 'FINISHED' : (s.status === 'Running' ? 'RELEASING' : 'NOT_YET_RELEASED'),
      cover: s.image ? String(s.image.medium).replace('http:','https:') : '', genres: s.genres || [] }; });
  }
  if (!relayOn()) throw new Error('relay');
  const r = await fetch(MOVIES_RELAY + '/search?all=1&q=' + encodeURIComponent(q));
  if (!r.ok) throw new Error('movie');
  const j = await r.json();
  return (j.results || (j.result ? [j.result] : [])).slice(0, 15).map(m => ({ type:'movie', id:m.id, t:m.title, year:(m.date || '').slice(0,4), date:m.date || '',
    cover: m.poster ? 'https://image.tmdb.org/t/p/w185' + m.poster : '' }));
}
function inLibrary(x){ return state.library.some(y => typeOf(y) === x.type && ((x.type === 'anime' && y.anilistId === x.id) || (x.type === 'tv' && y.tvmazeId === x.id) || (x.type === 'movie' && y.tmdbId === x.id) || norm(y.title) === norm(x.t))); }
function onWeek(x){ return state.shows.some(s => (x.type === 'anime' && s.anilistId === x.id) || (x.type === 'tv' && s.tvmazeId === x.id) || norm(s.title) === norm(x.t)); }
function onList(x){ return state.watchlist.some(m => norm(m.title) === norm(x.t)); }
function renderFind(){
  if (!finder.results.length) return '<p class="meta" style="margin:4px 2px">No matches. Try a shorter or different title.</p>';
  return '<div class="frlist">' + finder.results.map((x, n) => {
    const meta = [x.year, x.type === 'anime' ? [x.eps ? x.eps + ' eps' : '', x.fmt === 'MOVIE' ? 'Movie' : ''].filter(Boolean).join(', ') : x.where,
      x.status === 'RELEASING' ? 'Airing now' : x.status === 'NOT_YET_RELEASED' ? 'Coming soon' : ''].filter(Boolean).join(', ');
    const first = inLibrary(x) ? '<span class="meta ok">In your library</span>' : '<button class="btn small" data-fw="' + n + '">Watched</button>';
    const second = x.type === 'movie'
      ? (onList(x) ? '<span class="meta ok">On your list</span>' : '<button class="btn ghost small" data-fl="' + n + '">Want to watch</button>')
      : (onWeek(x) ? '<span class="meta ok">On your week</span>' : '<button class="btn ghost small" data-fs="' + n + '">Start watching</button>');
    return '<div class="card fres">' + tile(x.t, x.cover) + '<div class="cardmain"><span class="ttl"><span class="wrap">' + esc(x.t) + '</span></span><span class="meta">' + esc(meta) + '</span></div><div class="fbtns">' + first + second + '</div></div>';
  }).join('') + '</div>';
}
function findSheet(type, ctx){
  finder.type = type || 'anime'; finder.ctx = ctx || 'library'; finder.q = ''; finder.results = []; finder.token++;
  const segs = [['anime','Anime'],['tv','TV'],['movie','Movies']].map(([k,l]) => '<button type="button" data-ftype="' + k + '" aria-pressed="' + (k === finder.type) + '">' + l + '</button>').join('');
  openSheet(
    '<h2>Find a title</h2><p class="meta" style="margin:0">Search anything, old or new. Mark it as watched to build your library, or start watching it.</p>' +
    '<div class="seg" role="group" aria-label="What to search" style="margin:0">' + segs + '</div>' +
    '<label class="vh" for="f-q">Title</label><input id="f-q" class="search" style="margin:0" type="search" autocomplete="off" placeholder="e.g. Underworld">' +
    '<div id="f-res"><p class="meta" style="margin:4px 2px">Type a title to search.</p></div>' +
    '<p class="meta" style="margin:0">Can’t find it? <button class="linkbtn" id="f-manual">Add it by hand</button></p>' +
    '<div class="actions"><button class="btn ghost" data-close="1">Done</button></div>',
    sheet => {
      const input = $('#f-q', sheet), res = $('#f-res', sheet);
      input.focus();
      const run = async () => {
        const q = finder.q.trim(), token = ++finder.token;
        if (q.length < 2){ res.innerHTML = '<p class="meta" style="margin:4px 2px">Type a title to search.</p>'; return; }
        res.innerHTML = '<p class="meta" style="margin:4px 2px">Searching…</p>';
        try { const list = await findTitles(finder.type, q); if (token !== finder.token) return; finder.results = list; res.innerHTML = renderFind(); }
        catch(e){ if (token === finder.token) res.innerHTML = '<p class="meta" style="margin:4px 2px">' + (e.message === 'relay' ? 'Movie search isn’t switched on yet.' : 'Couldn’t search right now. Check your connection and try again.') + '</p>'; }
      };
      input.addEventListener('input', () => { finder.q = input.value; clearTimeout(finder.timer); finder.timer = setTimeout(run, 400); });
      input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); clearTimeout(finder.timer); run(); } });
      sheet.querySelectorAll('[data-ftype]').forEach(b => b.addEventListener('click', ev => {
        ev.stopPropagation(); finder.type = b.dataset.ftype;
        sheet.querySelectorAll('[data-ftype]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        input.placeholder = finder.type === 'movie' ? 'e.g. Underworld' : finder.type === 'tv' ? 'e.g. The Expanse' : 'e.g. Fullmetal Alchemist';
        run(); input.focus();
      }));
      $('#f-manual', sheet).addEventListener('click', ev => {
        ev.stopPropagation(); const t = finder.type;
        if (finder.ctx === 'library') libSheet({ id: uid(), type: t, title: finder.q.trim(), season:'', eps:null, status:'completed', fav:false }, true);
        else if (t === 'movie') movieSheet();
        else showSheet({ id: uid(), type: t, title: finder.q.trim(), day: null, time:'', ep:0, total:null, premiere:'', isNew:false, fav:false }, true);
      });
      res.addEventListener('click', ev => {
        const b = ev.target.closest('button'); if (!b) return;
        ev.stopPropagation();
        const x = finder.results[Number(b.dataset.fw ?? b.dataset.fl ?? b.dataset.fs)]; if (!x) return;
        if (b.dataset.fw != null){
          const entry = { id: uid(), type: x.type, title: x.t, season: x.year || '', eps: x.eps || null, fav:false, status:'completed', cover: x.cover || '', coverChecked: true, genres: x.genres || [] };
          if (x.type === 'anime') entry.anilistId = x.id; else if (x.type === 'tv') entry.tvmazeId = x.id; else entry.tmdbId = x.id;
          state.library.push(entry); save(); res.innerHTML = renderFind(); toast('Added ' + x.t + ' to your library');
        } else if (b.dataset.fl != null){
          state.watchlist.push({ id: uid(), title: x.t, date: x.date || '', where: '', cover: x.cover || '' });
          save(); res.innerHTML = renderFind(); toast('Added ' + x.t + ' to your movie list');
        } else {
          const n = x.next, finished = x.status === 'FINISHED', at = n ? new Date(n.airingAt * 1000) : null;
          const s = { id: uid(), type: x.type, title: x.t, cover: x.cover || '', genres: x.genres || [], day: at ? at.getDay() : null, time: at ? hm(at) : '',
            ep:0, total:null, premiere:'', isNew:false, fav:false, backlog: finished };
          if (x.type === 'anime'){ s.anilistId = x.id; s.linkTitle = x.t; s.epOffset = 0; s.live = { total: x.eps, aired: n ? n.episode - 1 : (finished ? x.eps : 0), at: n ? n.airingAt * 1000 : null, status: x.status }; }
          else s.tvmazeId = x.id;
          showSheet(s, true);
        }
        if (ui.tab === 'library' || ui.tab === 'week') render();
      });
    }
  );
}

/* ---------- Title hints while typing ---------- */
function attachSuggest(sheet, inputSel, getType, onPick){
  const input = $(inputSel, sheet);
  if (!input) return;
  const box = document.createElement('div');
  box.className = 'suggest'; box.setAttribute('role', 'listbox'); box.setAttribute('aria-label', 'Matching titles'); box.hidden = true;
  input.after(box);
  input.setAttribute('autocomplete', 'off'); input.setAttribute('aria-autocomplete', 'list');
  let timer = null, token = 0, list = [];
  const close = () => { box.innerHTML = ''; box.hidden = true; };
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2){ token++; close(); return; }
    timer = setTimeout(async () => {
      const t = ++token;
      try {
        const res = await findTitles(getType(), q);
        if (t !== token) return;
        list = res.slice(0, 5);
        if (!list.length){ close(); return; }
        box.innerHTML = list.map((x, n) => {
          const meta = [x.year, x.type === 'tv' ? x.where : (x.eps ? x.eps + ' eps' : ''), x.type === 'anime' && x.fmt === 'MOVIE' ? 'Movie' : ''].filter(Boolean).join(', ');
          return '<button type="button" class="sug" role="option" data-sug="' + n + '">' + tile(x.t, x.cover) + '<span class="info"><span>' + esc(x.t) + '</span><span class="meta">' + esc(meta || ' ') + '</span></span></button>';
        }).join('') + '<button type="button" class="sug none" data-sug="-1"><span class="meta">None of these. Keep what I typed.</span></button>';
        box.hidden = false;
      } catch(e){ close(); }
    }, 350);
  });
  input.addEventListener('keydown', e => { if (e.key === 'Escape' && !box.hidden){ e.stopPropagation(); close(); } });
  box.addEventListener('click', ev => {
    const b = ev.target.closest('[data-sug]'); if (!b) return;
    ev.stopPropagation();
    const n = Number(b.dataset.sug);
    if (n >= 0){ const x = list[n]; input.value = x.t; onPick(x); } else onPick(null);
    token++; close(); input.focus();
  });
}
function linkedNote(sheet, id, x){
  const el = $('#' + id, sheet); if (!el) return;
  el.textContent = x ? 'Matched to ' + x.t + (x.year ? ' (' + x.year + ')' : '') + '. Poster and details will come from it.' : '';
}
function applyPick(target, x){
  target.cover = x.cover || ''; target.coverChecked = true;
  if (x.genres && x.genres.length) target.genres = x.genres;
  target.anilistId = null; target.tvmazeId = null; target.tmdbId = null;
  if (x.type === 'anime') target.anilistId = x.id; else if (x.type === 'tv') target.tvmazeId = x.id; else target.tmdbId = x.id;
}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => {
    if (b.dataset.tab === ui.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const v = $('#view');
  const active = document.activeElement && document.activeElement.id;
  const keep = {}; ['fr-in','sh-name'].forEach(id => { const el = document.getElementById(id); if (el) keep[id] = el.value; });
  v.innerHTML = ui.tab === 'week' ? weekView() : ui.tab === 'season' ? seasonView() : ui.tab === 'friends' ? friendsView() : libraryView();

  if (active === 'fr-in' || active === 'sh-name'){ const el = document.getElementById(active); if (el) el.focus(); }
  if (active === 'sq' || active === 'lq'){ const el = document.getElementById(active); if (el){ el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch(_){} } }
}
